<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ю.В. МАНН. КОМЕДИЯ ГОГОЛЯ «РЕВИЗОР». «СБОРНЫЙ ГОРОД»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6d6b66; --line:#e3e1db;
  --accent:#2f4b7c; --accent-soft:#e8edf6; --mark:#fbf1c7; --ok:#2e7d5b; --ok-soft:#e3f2ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.app.nosb{grid-template-columns:1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .sp{flex:1}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .35s ease}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
#menuBtn{display:none}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px}
.side .grp{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.side .grp.num{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent)}
.side a{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.side a .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.side a.sub{padding-left:26px;font-size:13.5px;color:var(--muted)}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side a.on .n{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.side a.seen .n{border-color:var(--accent);color:var(--accent)}
/* main */
.main{overflow:auto;position:relative;scroll-behavior:smooth}
.stage{max-width:820px;margin:0 auto;padding:40px 32px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:48px 56px}
.slide{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;line-height:1.5}
.doc-h{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0 0 28px;font-weight:700}
.prose{font-family:var(--serif);font-size:19px;line-height:1.72}
.prose p{margin:0 0 1.05em;text-indent:1.4em;hyphens:auto}
.prose h2{font-family:var(--sans);font-size:22px;font-weight:600;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:inline-block}
.prose h2+p,.prose .part-no+p,.prose p:first-child{text-indent:0}
.prose strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 1px}
.prose em{font-style:italic}
.prose sup.ref{font-family:var(--sans);font-size:.6em;color:var(--muted);vertical-align:super;line-height:0}
.part-no{font-family:var(--serif);font-size:56px;line-height:1;color:var(--accent);margin:0 0 20px;font-weight:700}
.part-no::after{content:"";display:block;width:40px;height:2px;background:var(--accent);margin-top:14px}
/* cover */
.cover{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.cover figure{margin:0}
.cover img{width:100%;border-radius:10px;display:block}
.cover figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:10px;text-indent:0}
.cover figcaption strong{background:none;font-weight:600;color:var(--ink)}
.cover .big{font-family:var(--serif);font-size:20px;letter-spacing:.3em;margin:0 0 22px;color:var(--muted);font-weight:400}
.cover .eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cover .work{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1}
/* pager */
.pager{position:sticky;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 0 18px;margin-top:-80px}
.pager .bar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.pager .cnt{font-size:13px;color:var(--muted);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.pager button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.pager button.next{background:var(--accent);color:var(--panel)}
.pager button:disabled{opacity:.3;cursor:default}
.pager svg{width:20px;height:20px}
/* terms */
.lead{font-family:var(--serif);font-size:19px;line-height:1.65;margin:0 0 26px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.term{display:flex;align-items:center;gap:12px;padding:16px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);font-family:var(--serif);font-size:17.5px;font-weight:700;transition:.2s;user-select:none;text-align:left;width:100%}
.term:hover{border-color:var(--accent)}
.term .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;transition:.2s}
.term .box svg{width:15px;height:15px;opacity:0;color:#fff}
.term.on{border-color:var(--ok);background:var(--ok-soft)}
.term.on .box{background:var(--ok);border-color:var(--ok)}
.term.on .box svg{opacity:1}
.meter{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter .fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.meter .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:18px 22px;border-radius:0 12px 12px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
.callout strong{color:var(--accent)}
/* essay */
.q{border:1px solid var(--line);border-radius:14px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.q-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.q-head .no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.q-head .tx{flex:1;font-family:var(--serif);font-size:18px;line-height:1.5;padding-top:4px}
.q-head .chev{flex:0 0 20px;margin-top:8px;color:var(--muted);transition:transform .25s}
.q.open .chev{transform:rotate(180deg)}
.q-body{display:none;padding:0 20px 20px 70px}
.q.open .q-body{display:block}
.q textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--serif);font-size:17px;line-height:1.6;background:var(--bg);color:var(--ink);resize:vertical}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.q .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:13px;flex:0 0 8px;opacity:0}
.q.has .dot{opacity:1}
/* glossary */
.gl-tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;height:42px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;width:44px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--panel)}
.seg svg{width:19px;height:19px}
.abc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.abc button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--serif);font-size:16px;text-transform:uppercase}
.abc button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gl-list{list-style:none;margin:0;padding:0}
.gl-list li{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.gl-list li:first-child{border-top:0}
.gl-list .t{font-family:var(--serif);font-weight:700;font-size:18px}
.gl-list .d{font-family:var(--serif);font-size:17.5px;line-height:1.55}
.gl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.flip{perspective:1000px;height:180px;cursor:pointer;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel)}
.flip .f{font-family:var(--serif);font-weight:700;font-size:21px}
.flip .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);font-family:var(--serif);font-size:15.5px;line-height:1.45;overflow:auto;align-items:safe center}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:28px}
/* mobile */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  #menuBtn{display:grid}
  .side{position:fixed;top:56px;left:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .app.sbopen .side{transform:none}
  .stage{padding:20px 16px 110px}
  .card{padding:28px 20px;border-radius:12px}
  .prose{font-size:18px}
  .cover{grid-template-columns:1fr;gap:20px}
  .cover figure{max-width:220px}
  .cover .work{font-size:34px}
  .doc-h{font-size:24px}
  .gl-list li{grid-template-columns:1fr;gap:4px}
  .q-body{padding:0 16px 16px}
  .top .crumb,.top .sep{display:none}
}
@media print{
  .top,.side,.pager{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>

<div class="app" id="app">

    <button class="icon-btn" id="menuBtn" aria-label="☰"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

    <div class="sp"></div>

</div>
<script>
const MODE="slides", KEY="Ревизор_02_Манн_Комедия_Гоголя_Ревизор_Сборный_город_html", D={"heading": "Ю.В. МАНН. КОМЕДИЯ ГОГОЛЯ «РЕВИЗОР». «СБОРНЫЙ ГОРОД»", "kicker": "Прочитайте фрагменты статьи Ю.В. Манна, посвященные комедии Гоголя “Ревизор”", "pages": [{"group": "", "label": "Незадолго до «Ревизора» Гоголь написал статью…", "html": "<p>Незадолго до «Ревизора» Гоголь написал статью «Последний день Помпеи». Статья посвящена знаменитой картине Брюллова. Что могло быть общего между тем сатирическим, обличительным направлением, которое всё решительнее принимало творчество Гоголя, и экзотическим сюжетом «Последнего дня Помпеи»? Между заурядными, пошлыми, серыми «существователями» и «роскошно-гордыми» героями античного мира, сохранившими красоту и грацию даже в момент страшного удара? Но Гоголь решительно провозгласил «Последний день Помпеи» жгуче современным, как мы бы сказали,— злободневным произведением. «Картина Брюллова может назваться полным, всемирным созданием». Писатель не счел необходимым объяснять русскому читателю содержание картины: «Я не стану изъяснять содержание картины и приводить толкования и пояснения на изображенные события. ...Это <em>слишком очевидно, слишком касается жизни человека».<\/em> Это жителей-то средней России, не знавших ни землетрясений, ни других геологических катаклизмов!<\/p><p>Но Гоголь увидел за экзотическим сюжетом картины ее глубоко современную художественную мысль. «Мысль ее принадлежит совершенно вкусу нашего века, который вообще, как бы чувствуя свое страшное раздробление, стремится совокуплять все явления в общие группы и выбирает сильные кризисы, чувствуемые целою массою». Это очень интимные строки, приоткрывающие склад художественного мироощущения самого Гоголя, сплетение в нем двух — на первый взгляд несовместимых — тенденций.<\/p><p>С одной стороны, понимание «страшного раздробления» жизни. Гоголь был одним из тех художников, кто необычайно глубоко ощущал прогрессирующее разобщение, разъединение людей в новую эпоху. Может быть, одно из направлений этого процесса Гоголь разглядел острее, чем другие великие реалисты: угасание общей заботы, всенародного дела, основанного на согласованном и бескорыстном участии индивидуальных воль. Не без горечи и наставительного упрека современникам рисовал он в статье «О средних веках» красочную (и, конечно, идеализированную) картину крестовых походов: «владычество <em>одной мысли<\/em> объемлет все народы»; «ни одна из страстей, ни одно собственное желание, ни <em>одна личная выгода<\/em> не входят сюда».<\/p><p>В произведениях Гоголя описания массовых и притом непременно бескорыстных действ играют особую, так сказать, поэтически-заглавную роль. Смертельная ли схватка запорожцев с иноземными врагами, озорные ли проделки парубков, свадебное ли торжество или просто пляска — во всем этом взгляд писателя жадно ищет отблеск «одной» движущей мысли, исключающей «личную выгоду». «Сорочинская ярмарка» заканчивается знаменитой сценой пляски: «Странное, неизъяснимое чувство овладело бы зрителем при виде, как от одного удара смычком музыканта в сермяжной свитке, с длинными закрученными усами, всё обратилось, волею и неволею, к единству и перешло в согласие... Всё неслось. Всё танцевало». Но почему же «странное», «неизъяснимое» чувство? Потому что Гоголь хорошо понимает, как необычно это согласие в новое время, среди «меркантильных душ».<\/p>"}, {"group": "", "label": "Для характеристики человеческих отношений, которые «укладываются»…", "html": "<p>Для характеристики человеческих отношений, которые «укладываются» в новый век, Гоголь нашел другой емкий образ. «Словом, как будто бы приехал в трактир огромный дилижанс, в котором каждый пассажир сидел во всю дорогу закрывшись и вошел в общую залу потому только, что не было другого места». Ни общей заботы, ни общего дела, ни даже поверхностного любопытства друг к другу! В «Невском проспекте» Пискарёву кажется, что «какой-то демон искрошил весь мир на множество разных кусков и все эти куски без смысла, без толку смешал вместе».<\/p><p>Меркантильность, в представлении Гоголя,— некое универсальное качество современной жизни — и русской и западноевропейской. Еще в «Ганце Кюхельгартене» Гоголь сетовал, что современный мир «расквадрачен весь на мили». В буржуазном умонастроении писатель острее всего чувствовал те черты, которые усиливались русскими условиями. Полицейский и бюрократический гнет отсталой России заставлял болезненнее воспринимать раздробленность и холод людских отношений.<\/p><p>Ив. Киреевский писал в 1828 году, касаясь отношения России к Западу, что народ «не стареется чужими опытами». Увы, стареется, если этот опыт находит в его собственном какую-нибудь аналогию...<\/p><p>Казалось бы, самое простое и логичное вынести из раздробленности «меркантильного» века мысль о фрагментарности художественного изображения в современном искусстве. К такому решению действительно склонялись романтики. Однако Гоголь делает другой вывод. Лоскутность и фрагментарность художественного образа — это, по его мнению, удел второстепенных талантов. Картину же Брюллова он ценит за то, что, при «страшном раздроблении» жизни, она тем не менее «стремится совокуплять все явления в общие группы». «Не помню, кто-то сказал, что в XIX веке невозможно появление гения всемирного, обнявшего бы в себе всю жизнь XIX века,— пишет Гоголь в «Последнем дне Помпеи».— Это совершенно несправедливо, и такая мысль исполнена безнадежности и отзывается каким-то малодушием. Напротив: никогда полет гения не будет так ярок, как в нынешние времена... И его шаги уже верно будут исполински и видимы всеми». Чем сильнее угнетала Гоголя мысль о раздробленности жизни, тем решительнее заявлял он о необходимости широкого синтеза в искусстве.<\/p><p>И тут нам приоткрывается другая (к сожалению, еще не оцененная) черта мироощущения Гоголя. Но только Гоголя-художника, но и Гоголя-мыслителя, историка, поскольку как раз в этом пункте направления его художественной и собственно научной, логически оформляемой, мысли максимально совпадали.<\/p><p>Много писалось о пробелах в образовании Гоголя, поверхностно знакомого с важнейшими явлениями современной ему умственной жизни. Действительно, трудно было бы назвать Гоголя европейски образованным человеком, как, к примеру, Пушкина, Герцена или даже Надеждина. Но своим глубоким умом, каким-то чисто гоголевским даром прозрения и художественной интуицией Гоголь очень точно уловил главное направление идейных исканий тех лет.<\/p>"}, {"group": "", "label": "В статье «О преподавании всеобщей истории»…", "html": "<p>В статье «О преподавании всеобщей истории» Гоголь писал: «Всеобщая история, в истинном ее значении, не есть собрание частных историй всех народов и государств без общей связи, без общего плана, без общей цели, куча происшествий без порядка, в безжизненном и сухом виде, в каком очень часто ее представляют. Предмет ее велик: <em>она должна обнять вдруг и в полной картине все человечество..,<\/em> Она должна собрать в одно все народы мира, разрозненные временем, случаем, горами, морями, и соединить их в одно стройное целое; <em>из них составить одну величественную полную поэму...<\/em> Все события мира должны быть так тесно связаны между собою и цепляться одно за другое, как кольца в цепи. Если одно кольцо будет вырвано, то цепь разрывается. Связь эту не должно принимать в буквальном смысле. Она не есть та видимая, вещественная связь, которою часто насильно связывают происшествия, или система, создающаяся в голове независимо от фактов и к которой после своевольно притягивают события мира. Связь эта должна заключаться <em>в одной общей мысли:<\/em> в одной неразрывной истории человечества, перед которою и государства и события — временные формы и образы!». Таковы задачи, которые ставил перед собою Гоголь-историк, считавший одно время (как раз накануне создания «Ревизора») поприще исторического исследователя едва ли не самым интересным и важным. Можно было бы сделать подробные выписки, выясняющие степень близости взглядов Гоголя к современным ему прогрессивным направлениям в исторической науке (Гизо, Тьерри и др.), но такая работа — отчасти уже выполненная <em>—<\/em> увела бы нас далеко в сторону. Здесь важно подчеркнуть главную установку Гоголя — найти единую, всеохватывающую закономерность исторического развития. По Гоголю, эта закономерность обнаруживается и конкретизируется в системе, но такой, которая не подминает собою факты, а естественно и свободно вытекает из них. Характерен максимализм Гоголя, ставящего перед историей самые широкие задачи и верящего в их разрешение. Обнять судьбы всех народов, нащупать движущую пружину жизни всего человечества — на меньшее Гоголь не согласен.<\/p><p>Мысли Гоголя о задачах истории близки к идее «философии истории» — идее, сформировавшейся в конце XVIII — начале XIX века под сильным воздействием немецкой классической философии. Имена Канта, Шеллинга, Гегеля и Окена, фигурирующие в одной из рецензий Гоголя 1836 года, названы им с полным пониманием их исторической миссии,— как «художников», обработавших «в единство великую область мышления».<\/p><p>С другой стороны, Гоголь называет Гегеля и Шеллинга <em>«художниками»,<\/em> а выше мы видели, что и всеобщую историю он уподобляет «величественной полной <em>поэме».<\/em> Это не оговорки и не поэтические символы, а выражение тесной связи искусства и науки. Обе области духовной деятельности всегда были в сознании Гоголя максимально сближены. Ему всегда казалось, что, осуществляя свою миссию художника, он тем самым добывает для соотечественников достоверное, общественно ценное знание о жизни.<\/p><p>Когда Гоголь приступал к «Ревизору», то в глубинах его сознания смыкались мысль о широкой группировке лиц в произведении великого художника (как в «Последнем дне Помпеи») и идея всеобъемлющего синтеза, осуществляемого историком нашего времени.<\/p>"}, {"group": "", "label": "Но насколько же усложнил Гоголь-художник свою…", "html": "<p>Но насколько же усложнил Гоголь-художник свою задачу! Ведь ему надо было найти такой образ, который бы передавал «целое жизни» при страшном ее раздроблении, не затушевывая это раздробление...<\/p><p>В статье «О преподавании всеобщей истории», говоря о необходимости представить слушателям «эскиз всей истории человечества», Гоголь поясняет: «Всё равно, как нельзя узнать совершенно <em>город,<\/em> исходивши все его улицы: для этого нужно взойти <em>на возвышенное место,<\/em> откуда бы он виден был <em>весь как на ладони»<\/em>. В этих словах уже проступают контуры сценической площадки «Ревизора».<\/p><p>Художественная мысль Гоголя и раньше тяготела к широкому обобщению, что, в свою очередь, объясняет его стремление к циклизации произведений. Диканька, Миргород — это не просто места действия, а некие центры вселенной, так что можно сказать, как в «Ночи перед Рождеством»: «...и по ту сторону Диканьки, и по эту сторону Диканьки».<\/p><p>К середине 30-х годов тенденция гоголевской мысли к обобщению возросла еще больше. «В Ревизоре я решился собрать <em>в одну кучу все дурное в России,<\/em> какое я тогда знал, <em>все несправедливости,<\/em> какие делаются в тех местах и в тех случаях, где больше всего требуется от человека справедливости, и за одним разом посмеяться над всем»,— читаем мы в «Авторской исповеди». Тут же, как известно, Гоголь говорит о перемене в своем творчестве к середине 30-х годов, которая позднее, ретроспективно, представлялась ему даже коренным переломом: «Я увидел, что в сочинениях моих смеюсь даром, напрасно, сам не зная зачем. Если смеяться, так уже лучше смеяться сильно и над тем, что действительно достойно <em>осмеянья всеобщего»<\/em>.<\/p><p>Так возник город «Ревизора»,— по позднейшему определению Гоголя, «сборный город всей темной стороны».<\/p>"}, {"group": "2", "label": "Вдумаемся в значение того факта, что…", "html": "<div class=\"part-no\">2<\/div><p>Вдумаемся в значение того факта, что русская жизнь осмыслена в «Ревизоре» в <em>образе города.<\/em> Прежде всего, это расширяло социальный аспект комедии.<\/p><p>Если искать такое место, где, говоря словами Гоголя, более всего делалось несправедливости, то в первую очередь взгляд обращался к суду. В этом Гоголь убедился еще в Нежинской гимназии, мечтая посвятить себя юстиции: «Неправосудие, величайшее в свете несчастие, более всего разрывало мое сердце». Неправосудие питало традицию русской разоблачительной комедии, посвященной лихоимству и судебному произволу: «Судейские именины» Соколова, «Ябеда» Капниста, «Неслыханное диво, или Честный секретарь» Судовщикова и др.<\/p><p>Но в «Ревизоре» «дела судебные» занимают только часть — и, в общем, не самую большую часть — картины. Тем самым Гоголь сразу же раздвинул масштаб антисудебной, «ведомственной» комедии до комедии всеобщей или — будем пока держаться собственных понятий «Ревизора» — до комедии «всегородской».<\/p><p>Но и на фоне произведений, рисовавших жизнь всего города, «Ревизор» обнаруживает важные отличия. Гоголевский город последовательно иерархичен. Его структура строго пирамидальна: «гражданство», «купечество», выше — чиновники, городские помещики и, наконец, во главе всего—городничий. Не забыта и женская половина, тоже подразделяющаяся по рангам: выше всех семья городничего, затем — жены и дочери чиновников, вроде дочери Земляники, с которой дочери городничего пример брать не подобает; наконец, внизу — высеченная по ошибке унтер-офицерша, слесарша Пошлепкина... Вне города стоят только два человека: Хлестаков и его слуга Осип.<\/p><p>Такой расстановки персонажей мы не найдем в русской комедии (и не только комедии) до Гоголя. Показательнее всего здесь обратиться к произведениям со сходным сюжетом, то есть к тем, которые рисуют появление в городе мнимого ревизора (хотя о самой теме «ревизора» и «ревизии» мы пока говорить не будем). Так, в повести Вельтмана «Провинциальные актеры», опубликованной незадолго до «Ревизора», в 1835 году, кроме городничего, действуют и командир гарнизонного округа, и городской голова, и т. д. Благодаря этому идея власти, так сказать, раздробляется: городничий вовсе не является тем главным и единовластным правителем города, каким он предстает в «Ревизоре».<\/p><p>Ближе всего по структуре гоголевский город к городу из комедии Квитка-Основьяненко «Приезжий из столицы, или Суматоха в уездном городе». (Как известно, высказывалось предположение, что с этой комедией, опубликованной в 1840 году, но написанной в 1827 году, Гоголь познакомился в рукописи.) Городничий Трусилкин олицетворяет у Квитка-Основьяненко высшую власть в городе. Три чиновника, уже почти как «шесть чиновников» у Гоголя, представляют различные стороны городского управления: суд (судья Спалкин), почту (почтовый экспедитор Печаталкин), просвещение (смотритель училищ Ученосветов). К ним надо еще прибавить полицию в лице частного пристава Шарина. Однако у Квитка-Основьяненко нет нижних звеньев этой пирамиды — «купечества» и гражданства». Кроме того, велика группа людей, выпадающих из городской иерархии: помимо «ревизора» Пустолобова, сюда входят еще два приезжих (и притом добродетельных) героя: Отчетин и майор Милон. Их действия, направленные как бы в противовес действиям городских чиновников, ослабляют ту замкнутость и цельность, которой отличается город в «Ревизоре».<\/p>"}, {"group": "2", "label": "Выбор персонажей в «Ревизоре» обнаруживает стремление…", "html": "<p>Выбор персонажей в «Ревизоре» обнаруживает стремление охватить <em>максимально<\/em> все стороны общественной жизни и управления. Тут и судопроизводство (Ляпкин-Тяпкин), и просвещение (Хлопов), и здравоохранение (Гибнер), и почта (Шпекин), и своего рода социальное обеспечение (Земляника), и, конечно, полиция. Такого широкого взгляда на официальную, государственную жизнь русская комедия еще не знала. При этом Гоголь берет различные стороны и явления жизни без излишней детализации, без чисто административных подробностей — в их цельном, «общечеловеческом» выражении. Здесь интересно остановиться на некоторых «ошибках» «Ревизора», в которых нередко обвиняли писателя.<\/p><p>Уже современники Гоголя отметили, что структура уездного города воспроизведена в комедии не совсем точно: одни важные должностные лица забыты, другие, наоборот, добавлены. Сын городничего города Устюжна А.И. Макшеев писал: «Никакого попечителя богоугодных заведений не было, по крайней мере, в таких городах, как Устюжна, потому что не было самих богоугодных заведений». «С другой стороны, в комедии нет крупных деятелей в дореформенном суде, как исправник, секретари, предводители дворянства, стряпчий, откупщик и проч.». «Уездный судья, избираемый в дореформенное время из наиболее уважаемых дворян, большей частью не знал законов и ограничивал свою деятельность подписыванием бумаг, заготовленных секретарем, но не был Ляпкиным-Тяпкиным. Ляпкины-Тяпкины были исправник, хотя тоже выборный, но из дворян другого склада, чем судьи, секретари судов и многочисленное сословие приказчиков, о которых комедия умалчивает».<\/p><p>Симптоматичен ход мысли Макшеева, отразившийся в его записке. Макшеев <em>сравнивал<\/em> изображенное в «Ревизоре» с одним, реальным уездным городом (чтобы опровергнуть слухи, будто бы в комедии выводится его родной город Устюжна). А Гоголь-то рисовал в «Ревизоре» свой, «сборный» город!<\/p><p>Зачем нужны были писателю судьи, секретари судов и многочисленное сословие приказных, если эту сторону жизни с успехом представлял один Ляпкин-Тяпкин? Другое дело — попечитель богоугодных заведений Земляника: без него осталась бы в тени существенная часть «городской» жизни. В обоих случаях отступление Гоголя от реальной структуры города (неосознанное или сознательное — безразлично) имеет свою логику.<\/p><p>Конечно, для Гоголя важна не отвлеченная общественная функция персонажа (в этом случае возможно было бы придать одному лицу несколько функций), но его особенный, индивидуальный характер. Насколько разработана система должностных функций персонажей комедии, настолько же широка шкала их духовных свойств. Она включает в себя самые разнообразные краски — от добродушной наивности почтмейстера до каверзничества и коварства Земляники, от чванливости гордого своим умом Ляпкина-Тяпкина до смирения и запуганности Хлопова. В этом отношении город «Ревизора» так же многогранен и в известных пределах (в пределах комических возможностей характера) энциклопедичен. Но показательно, что психологическая и типологическая дифференциация персонажей идет у Гоголя вместе с дифференциацией собственно общественной.<\/p>"}, {"group": "2", "label": "Только две стороны государственной жизни не…", "html": "<p>Только две стороны государственной жизни не были затронуты в комедии: церковь и армия. Судить о намерениях автора «Ревизора» в отношении церкви трудно: духовенство вообще исключалось из сферы сценического изображения. Что же касается армии, то, по предположению Г. Гуковского, Гоголь оставил «военную часть государственной машины» в стороне, так как «считал ее необходимой». Но ведь писал же Гоголь о военных, причем с явно комической, снижающей интонацией, в других произведениях, например в «Коляске»! Видимо, причину нужно видеть в другом. Включение военных персонажей нарушило бы цельность «сборного города» — от общественной до собственно психологической. Военные — один персонаж или группа,— так сказать, экстерриториальны. Характерно, например, что в «Провинциальных актерах» Вельтмана командир гарнизонного округа Адам Иванович не только действует независимо от местных властей, но и в час суматохи, вызванной появлением мнимого генерал-губернатора, призывает к себе городничего, дает ему советы и т. д. Таким образом, идея строгой иерархии неизбежно подрывается. И по своим интересам, навыкам, общественным функциям военные персонажи нарушили бы единство города, являя собою целое в целом.<\/p><p>Интересно, что первоначально «военная тема» — хотя и приглушенно—звучала в «Ревизоре»: в сцене приема Хлестаковым отставного секунд-майора Растаковского. Но очень скоро Гоголь почувствовал, что воспоминания Растаковского из турецкой и других кампании, в которых он участвовал, подрывают «единство действия» комедии. Этой сцены нет уже в первом издании «Ревизора»; позднее Гоголь опубликовал ее в числе «Двух сцен, выключенных, как <em>замедлявших течение<\/em> пьесы». Надо сказать, что «замедление» действия здесь, в понимании Гоголя,— более широкая примета. Она скорее обозначает <em>неорганичность<\/em> данных сцен общему замыслу «Ревизора».<\/p><p>Иное дело «военные», чьи функции были направлены внутрь, чье положение целиком включено в систему данного города,— то есть полицейские. Их-то в комедии Гоголя предостаточно —четверо!<\/p><p>Какой же вывод напрашивается из всего сказанного? Что город в «Ревизоре» — прозрачная аллегория? Нет, это не так.<\/p><p>В научной литературе о Гоголе иногда подчеркивается, что «Ревизор» — это иносказательное изображение тех явлений, о которых Гоголь не мог — по цензурным соображениям — говорить прямо, что за условной декорацией уездного города следует видеть очертания царской столицы. Цензура, конечно, мешала Гоголю; столичная бюрократия, конечно, сильно дразнила его сатирическое перо, о чем свидетельствует известное признание писателя после представления «Ревизора»: «Столица щекотливо оскорбляется тем, что выведены нравы шести чиновников провинциальных; что же бы сказала столица, если бы выведены были хотя слегка ее собственные нравы?». Однако, сводя «Ревизор» к иносказательному обличению «высших сфер» русской жизни, мы совершаем подмену (очень частую в художественном разборе), когда о том, что есть, судят на основании того, что могло или, по представлениям исследователя, должно было быть. А между тем важно в первую очередь то, что есть.<\/p><p>Иногда также подсчитывают, сколько раз в «Ревизоре» упоминается Петербург, чтобы показать, что «тема Петербурга» составляет второй адрес гоголевской сатиры. Дескать, от этого возрастает «критическое начало» комедии.<\/p>"}, {"group": "2", "label": "Во всех этих случаях мы идем…", "html": "<p>Во всех этих случаях мы идем в <em>обход<\/em> художественной мысли «Ревизора» и, желая повысить «критическое начало» пьесы, на самом деле его принижаем. Ибо сила «Ревизора» не в том, насколько административно высок изображенный в нем город, а в том, что это <em>особый<\/em> город. Гоголем была создана такая модель, которая в силу органического и тесного сочленения всех компонентов, всех частей вдруг ожила, оказалась способной к самодвижению. По точному слову В. Гиппиуса, писатель нашел «масштаб минимально-необходимый». Но тем самым он создал благоприятные условия, чтобы прилагать этот масштаб к другим, более крупным явлениям — до жизни общероссийской, общегосударственной.<\/p><p>То, что содержание «Ревизора» распространяют на более широкие сферы жизни,—конечно, прерогатива читателя или зрителя. Но то, что оно <em>могло<\/em> распространиться — свойство художественной мысли Гоголя.<\/p><p>Оно возникло из стремления писателя к широкой и законченной группировке явлений, при которой бы они так тесно примыкали друг к другу, «как кольца в цепи».<\/p><p>Перед этим свойством художественной мысли «Ревизора» теряли свое преимущество таланты с более четкой, чем у Гоголя, политической целеустремленностью, с более откровенной публицистической окраской. В «Ревизоре», строго говоря, нет никаких обличительных инвектив, на которые щедра была комедия Просвещения и отчасти комедия классицизма. Только реплика Городничего: «Чему смеетесь? над собою смоетесь!» — могла напомнить такие инвективы. Кроме того, как уже отмечалось в литературе о Гоголе, должностные преступления, совершаемые героями «Ревизора», сравнительно невелики. Взимаемые Ляпкиным-Тяпкиным борзые щепки — мелочь по сравнению с поборами, которые учиняют, скажем, судейские из «Ябеды» Капниста. Но как говорил Гоголь, по другому поводу, «пошлость всего вместе испугала читателей». Испугало не нагнетание «деталей» пошлости, а, используя выражение Гоголя, «округление» художественного образа. «Округленный», то есть суверенный город из «Ревизора» становился эквивалентом более широких явлений, чем его предметное, «номинальное» значение.<\/p><p>Еще одно свойство «Ревизора» усиливало его обобщающую силу. Цельность и округленность «сборного города» сочетались с его полной однородностью с теми обширными пространствами, которые лежали за «городской чертой». В русской комедии до Гоголя обычно место действия — поместная ли усадьба, суд или город — вырисовывалось как изолированный островок порока и злоупотреблений. Создавалось впечатление, что где-то за пределами сцены кипит настоящая «добродетельная» жизнь, которая вот-вот нахлынет на гнездо злонамеренных персонажей и смоет его. Тут дело не в торжестве добродетели в финале пьесы, а в неоднородности двух миров: сценического, видимого, и того, который подразумевался. Вспомним лишь «Недоросль» Фонвизина: эта ярчайшая и правдивейшая русская комедия XVIII века строится все же на выявлении такого контраста. «Горе от ума» Грибоедова полностью не рвет с этой традицией, но пытается приспособить ее к новым заданиям. Тут «изолирован», противопоставлен потоку жизни не видимый мир отрицательных персонажей — Фамусовых и Хлестовых, а внесценические одинокие фигуры князя Григория и других «врагов исканий» вместе с находящимся на сцене, но столь же одиноким Чацким. Однако, как бы то ни было, существуют два мира и между ними — демаркационная черта.<\/p>"}, {"group": "2", "label": "Гоголь — первый русский драматург, который…", "html": "<p>Гоголь — первый русский драматург, который стер эту черту. От города в «Ревизоре» до границы—«хоть три года скачи» — не доедешь, но есть ли на всем этом пространстве хоть одно место, где бы жизнь протекала по иным нормам? Хоть один человек, над которым были бы властны другие законы? В комедии всё говорит за то, что такого места и таких людей нет. Все нормы общежития, обращения людей друг к другу выглядят в пьесе как повсеместные. Они действуют и во время пребывания в городе необычного лица — «ревизора». Ни у кого из героев пьесы не появляется потребности в иных нормах или хотя бы в частичном видоизменении старых. С первых же минут открытия «ревизора» к нему почти рефлекторно потянулась длинная цепь взяткодателей — от городничего и чиновников до купцов. Конечно, могло быть и так, что «ревизор» не взял бы. Но тот, с кем случилось бы подобное, знал бы, что это его личное невезенье, а не победа честности и закона над неправдой.<\/p><p>Но откуда у героев пьесы (а вместе с ними и у зрителей) такое убеждение? Из своего личного, «городского» опыта. Они знают, что их нормы и обычаи будут близки и понятны другим, как язык, на котором они говорят, хотя, вероятно, большинство из них не бывало дальше уезда или, в крайнем случае, губернии.<\/p><p>Словом, город «Ревизора» устроен так, что ничто не ограничивает распространение идущих от него токов вширь, на сопредельные пространства. Ничто не мешает «самодвижению» чудесного города. Как в «Ночи перед Рождеством» о Диканьке, так теперь о безымянном городе «Ревизора» писатель мог бы сказать: «И по ту сторону города, и по эту сторону города...»<\/p><p>Как я пытаюсь показать в другом мосте, гротеск неминуемо ведет к повышенной обобщенности. Благодаря фантастике и другим формам остранения, из целой исторической эпохи (или нескольких эпох) извлекается её «смысл». «История одного города» Салтыкова-Щедрина <em>—<\/em> это не только история <em>одного<\/em> города (Глупова или любого другого), а — в определенном разрезе — вся русская жизнь, то есть те «характеристические черты русской жизни, которые делают ее не вполне удобною». Диапазон обобщаемого в гротеске может расширяться и дальше, до «подведения итогов» всей истории человечества, как в «Путешествиях Лемюэля Гулливера» Свифта.<\/p><p>С другой стороны, те гротескные произведения, которые, подобно «Невскому проспекту» или «Носу», сконцентрированы на одном, исключительном, анекдотичном случае, тоже подводят к повышенной обобщенности. Именно потому, что предмет изображения здесь «странен», единичен, он — как исключение — подтверждает правило.<\/p><p>«Ревизор» представляет собою редкий случай произведения, в котором повышенная обобщенность достигается ни первым, ни вторым способом. В «Ревизоре», строго говоря, основа — вполне «земная», прозаическая, <em>негротескная,<\/em> в частности, в комедии совсем нет фантастики. Гротесков только дополнительный тон, «отсвет», о чем мы будем говорить в своем месте. Этот гротескный «отсвет» усиливает обобщающий характер комедии, но зарождается он уже в самой структуре «сборного города». В гоголевской комедии словно спрятан секрет, благодаря которому все её краски и линии, такие обычные и будничные, удвояются, приобретают дополнительное значение.<\/p><p>Осмысливая свой творческий опыт драматурга, в первую очередь опыт «Ревизора», Гоголь дважды ссылался на Аристофана: в «Театральном разъезде...» и в статье «В чем же, наконец, существо русской поэзии и в чем ее особенность».<\/p>"}, {"group": "2", "label": "В «Театральном разъезде...» происходит диалог между…", "html": "<p>В «Театральном разъезде...» происходит диалог между двумя «любителями искусств». Второй высказывается за такое построение пьесы, которое охватывает всех персонажей: «...ни одно колесо не должно оставаться как ржавое и не входящее в дело». Первый возражает: «Но это выходит, придавать комедии какое-то значение более всеобщее». Тогда второй «любитель искусств» доказывает свою точку зрения исторически: «Да разве не есть это ее [комедии] прямое и настоящее значение? В самом начале комедия была <em>общественным, народным созданием.<\/em> По крайней мере, такою показал ее сам <em>отец ее, Аристофан.<\/em> После уже она вошла в узкое ущелье частной завязки...».<\/p><p>Имя Аристофана названо Гоголем и в статье «В чем же, наконец, существо русской поэзии...», но в несколько ином контексте. «Общественная комедия», предшественником которой был Аристофан, обращается против <em>«целого множества<\/em> злоупотреблений, против уклоненья <em>всего общества<\/em> от прямой дороги».<\/p><p>В размышлениях Гоголя об Аристофане заметен интерес к двум, конечно, взаимосвязанным вопросам: о природе обобщения в комедии и об ее построении, о «завязке». На последнем вопросе уместнее остановиться несколько ниже. Но первый имеет прямое отношение к теме настоящей главы.<\/p><p>Несомненно, что интерес Гоголя к Аристофану стимулировался известным сходством их художественной мысли. Гоголю близко было стремление к крайнему обобщению, которое отличало древнюю аттическую комедию и делало её «общественным, народным созданием».<\/p><p>Это сходство впервые обосновал В. Иванов в статье «“Ревизор” Гоголя и комедия Аристофана». Отличие «Ревизора» от традиционной европейской комедии и сходство с аристофановской в том, что его действие «не ограничивается кругом частных отношений, но, представляя их слагаемыми коллективной жизни, обнимает целый, в себе замкнутый и себе удовлетворяющий социальный мирок, символически равный любому общественному союзу и, конечно, отражающий в себе, как в зеркале... именно тот общественный союз, на потеху и в назидание коего правится комедийное действо». «Изображение целого города взамен развития личной или домашней интриги — коренной замысел бессмертной комедии». В соответствии с этим «все бытовые и обывательские элементы пьесы освещены со стороны их общественного значения... все тяжбы и дрязги, наветы и ябеды выходят из сферы гражданского в область публичного права».<\/p><p>Комедия Гоголя, заключает В. Иванов, «по-аристофановски» изображает русскую жизнь в форме «некоего социального космоса», который вдруг потрясается во всю свою ширь.<\/p><p>Надо сказать, однако, что это тонкое сопоставление Гоголя с Аристофаном незаметно переходит в отождествление двух художников. Автор статьи не учитывает, что на природу обобщения у античного драматурга Гоголь смотрит сквозь призму современных ему требований и современного ему художественного опыта.<\/p><p>Место действия у Аристофана — открытая площадка, не только в «Птицах», где события в самом доле происходит в птичьем полисе, между небом и землей, но и в других комедиях. Можно сказать, что сцена у Аристофана не замкнута, космически не ограничена.<\/p>"}, {"group": "2", "label": "У Гоголя же есть вполне конкретная…", "html": "<p>У Гоголя же есть вполне конкретная «единица» обобщения — его город. Опыт новейшего искусства, и, в частности, классицизма и Просвещения, не прошел для Гоголя бесследно. Его город локально ограничен, и вместе с тем он «сборный». Это конкретно оформленный, осязаемый город, но бездонно-глубокий по своему значению. Словом, к обобщению, широте Гоголь идет через пристальное и строго целенаправленное изучение данного «куска жизни» — черта, возможная только для нового сознания, художественного и научного.<\/p><p>Я не говорю здесь подробно, что общественная конкретность сочеталась у Гоголя с конкретностью психологической. К Гоголю как к писателю XIX века, художнику критического реализма, не подходит замечание, будто бы он изымает своих героев из сферы гражданского права в пользу права публичного. Гоголевское «право» — это особое «право», в котором увязаны в одно целое и публичный и гражданский аспекты (разумеется, в смысле, свободном от господствовавших официальных правовых понятий).<\/p><p>Как известно, в 1846—1847 годах Гоголь предпринял попытку переосмысления «Ревизора». В «Развязке Ревизора» устами Первого комического актера было сообщено, что безымянный город — это внутренний мир человека, наш «душевный город»; безобразные чиновники — наши страсти; Хлестаков — «ветреная светская совесть»; наконец, настоящий ревизор — подлинная совесть, являющаяся нам в последние мгновения жизни... Толкование мистическое, сводящее почти на нет весь общественный, социальный смысл комедии. Однако интересен метод «Развязки Ревизора», как бы отражающий в кривом зеркале метод «Ревизора» настоящего.<\/p><p>По тонкому замечанию В. Иванова, «Развязка Ревизора» снова «обличает бессознательное тяготение Гоголя к большим формам всенародного искусства: как в первоначальном замысле мы усмотрели нечто общее с «высокою» комедией древности, так сквозь призму позднейшего домысла выступают в пьесе-оборотне характерные черты средневекового действа»<em>.<\/em><\/p><p>Следовало бы только подчеркнуть, во-первых, что новый образ Города был построен на старом фундаменте, что он паразитировал на силе обобщения, скрытой в реалистическом «Ревизоре». А во-вторых, новое обобщение Гоголя также скрывало в себе черты современного сознания — на этот раз мистически-русофильского толка.<\/p><p>Возвращаясь же к «Ревизору», нужно выделить еще одну — пожалуй, главную — черту, делающую обобщение гоголевской комедии современным. Мы помним, что картину Брюллова писатель назвал современной потому, что «она совокупляет все явления в общие группы» и выбирает «кризисы, чувствуемые целою массою». Гоголевский «сборный город» —это вариант «общей группы», однако все дело в том, что ее существование в современности почти невозможно. Может быть, и возможно, но эфемерно, недлительно. Ведь господствующий дух нового времени — раздробление («страшное раздробление», говорит Гоголь). Значит, неминуемо грозит распасться, разойтись— по интересам, наклонностям, стремлениям — все то, что писатель собирал «по словечку» в одно целое.<\/p><p>Но целое для Гоголя настоятельно необходимо и важно. Это вопрос не только художественный, структурно-драматургический, но и жизненный. Вне целого Гоголь не мыслит себе познания современности. Но вне целого Гоголь не мыслит себе и правильного развития человечества. Каким же путем удержать «общую группу» от распадения?<\/p>"}, {"group": "2", "label": "Очевидно, возможны были два художественных решения…", "html": "<p>Очевидно, возможны были два художественных решения. Или соединять «все явления в общие группы» <em>вопреки<\/em> духу времени, духу разъединения. Но такой путь чреват был опасностью идеализации и скрадывания противоречий. Или же — искать в жизни такие моменты, когда эта цельность возникает естественно — пусть ненадолго, подобно вспышке магния,— словом, когда цельность не скрадывает, а   обнажает  «страшное раздробление» жизни.<\/p><p>И тут мы должны обратить внимание на вторую часть гоголевской фразы: «...и выбирает сильные кризисы, чувствуемые целою массою». По представлению Гоголя, такой выбор диктуется «мыслью» картины. О «мысли» произведения — в частности, драматургического — Гоголь не устает напоминать из года в год. Так, в «Театральном разъезде...» говорится: «...правит пиесою идея, мысль. Без нее нет в ней единства». Гоголевская формула «мысли» толкуется исключительно как указание на «идейность» произведения, тогда как в действительности у неё есть более конкретный смысл.<\/p><p>В «Портрете» (редакция «Арабесок») Гоголь писал, что иногда осенял художника «внезапный призрак <em>великой мысли,<\/em> воображение видело в темной перспективе что-то такое, <em>что схвативши и бросивши на полотно,<\/em> можно было сделать необыкновенным и вместе доступным для всякой души».<\/p><p>Итак, это не идея произведения вообще, а скорее нахождение некой <em>современной ситуации<\/em> («сильного кризиса»), которая бы позволила замкнуть группу действующих лиц в одно целое.<\/p><p>В статье «Последний день Помпеи» это положение высказано еще отчетливее: «Создание и обстановку <em>своей мысли<\/em> произвел он [Брюллов] необыкновенным и дерзким образом: он схватил молнию и бросил ее целым потопом на свою картину. Молния у него залила и потопила все, как будто бы с тем, чтобы все выказать, чтобы ни один предмет не укрылся от зрителя». «Молния» — то есть извержение вулкана —  вот та сила, которая замкнула «общую группу» людей даже при страшном и прогрессирующем раздроблении жизни.<\/p><p>Но не так ли и Гоголь необыкновенно и дерзко «бросил» на полотно идею «ревизора», которая залила и потопила весь город? Словом, Гоголь создал в комедии насквозь современную и новаторскую ситуацию, в которой раздираемый внутренними противоречиями Город оказался вдруг способным к цельной жизни — ровно на столько времени, сколько понадобилось для раскрытия его самых глубоких, движущих пружин.<\/p>"}]};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
};
/* theme */
(function(){const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t;
 $('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#151618';
  const n=dark?'light':'dark';document.documentElement.dataset.theme=n;store.set('theme',n)};})();
$('#menuBtn').onclick=()=>$('#app').classList.toggle('sbopen');
const prog=p=>$('#prog').style.width=(p*100)+'%';

/* ---------- slides ---------- */
if(MODE==='slides'){
  const P=D.pages; let cur=Math.min(store.get('pos',0),P.length-1); let seen=new Set(store.get('seen',[]));
  const side=$('#side'); let h=''; let lastG=null;
  const gcount={}; P.forEach(p=>{if(p.group)gcount[p.group]=(gcount[p.group]||0)+1});
  P.forEach((p,i)=>{
    const multi=p.group&&gcount[p.group]>1;
    if(p.group!==lastG&&p.group&&(multi||/^\d$/.test(p.group))){
      if(!(multi&&p.label===p.group)) h+=`<div class="grp${/^\d$/.test(p.group)?' num':''}">${esc(p.group)}</div>`;
    }
    lastG=p.group;
    const sub=multi&&p.label!==p.group;
    h+=`<a data-i="${i}" class="${sub?'sub':''}"><span class="n">${i+1}</span><span>${esc(p.label)}</span></a>`;
  });
  side.innerHTML=h;
  side.onclick=e=>{const a=e.target.closest('a');if(a){go(+a.dataset.i);$('#app').classList.remove('sbopen')}};
  function go(i){
    if(i<0||i>=P.length)return; cur=i; seen.add(i); store.set('pos',i); store.set('seen',[...seen]);
    const head=(i===0&&D.heading)?`${D.kicker?`<div class="kicker">${esc(D.kicker)}</div>`:''}<h1 class="doc-h">${esc(D.heading)}</h1>`:'';
    $('#stage').innerHTML=`<article class="card slide">${head}<div class="prose">${P[i].html}</div></article>`;
    $('#main').insertAdjacentHTML('beforeend','');
    pager.querySelector('.cnt').textContent=`${i+1} / ${P.length}`;
    pager.querySelector('.prev').disabled=i===0; pager.querySelector('.next').disabled=i===P.length-1;
    side.querySelectorAll('a').forEach(a=>{const k=+a.dataset.i;a.classList.toggle('on',k===i);a.classList.toggle('seen',seen.has(k)&&k!==i)});
    const on=side.querySelector('a.on'); if(on)on.scrollIntoView({block:'nearest'});
    $('#main').scrollTo({top:0,behavior:'instant'}); prog((i+1)/P.length);
  }
  const pager=document.createElement('div'); pager.className='pager';
  pager.innerHTML=`<div class="bar"><button class="prev" aria-label="←">${ICON.l}</button><span class="cnt"></span><button class="next" aria-label="→">${ICON.r}</button></div>`;
  $('#main').appendChild(pager);
  pager.querySelector('.prev').onclick=()=>go(cur-1); pager.querySelector('.next').onclick=()=>go(cur+1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  go(cur);
}

/* ---------- terms ---------- */
if(MODE==='terms'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let on=new Set(store.get('on',[]));
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <p class="lead">${D.intro}</p>
   <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="val" id="val"></div></div>
   <ul class="terms">${D.terms.map((t,i)=>`<li><button class="term" data-i="${i}"><span class="box">${ICON.chk}</span><span>${esc(t)}</span></button></li>`).join('')}</ul>
   <div class="callout">${D.outro}</div></article>`;
  function upd(){document.querySelectorAll('.term').forEach(b=>b.classList.toggle('on',on.has(+b.dataset.i)));
    const p=on.size/D.terms.length;$('#fill').style.width=p*100+'%';$('#val').textContent=`${on.size} / ${D.terms.length}`;prog(p);store.set('on',[...on])}
  document.querySelectorAll('.term').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);upd()});
  upd();
}

/* ---------- essay ---------- */
if(MODE==='essay'){
  $('#app').classList.add('nosb'); $('#side').remove();
  const drafts=store.get('drafts',{});
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="callout" style="margin-bottom:28px">${D.intro}</div>
   ${D.questions.map((q,i)=>`<div class="q" data-i="${i}"><button class="q-head">${D.numbered?`<span class="no">${i+1}</span>`:''}<span class="tx">${q}</span><span class="dot"></span><span class="chev">${ICON.chev}</span></button>
     <div class="q-body"><textarea spellcheck="true" aria-label="${i+1}"></textarea></div></div>`).join('')}</article>`;
  function upd(){let n=0;document.querySelectorAll('.q').forEach(q=>{const has=!!(drafts[q.dataset.i]||'').trim();q.classList.toggle('has',has);if(has)n++});prog(n/D.questions.length)}
  document.querySelectorAll('.q').forEach(q=>{const i=q.dataset.i,ta=q.querySelector('textarea');ta.value=drafts[i]||'';
    q.querySelector('.q-head').onclick=()=>{q.classList.toggle('open');if(q.classList.contains('open'))ta.focus()};
    ta.oninput=()=>{drafts[i]=ta.value;store.set('drafts',drafts);upd()}});
  upd();
}

/* ---------- glossary ---------- */
if(MODE==='glossary'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let view=store.get('view','list'), letter=null, q='', flipped=new Set();
  const letters=[...new Set(D.entries.map(e=>e[0][0].toLowerCase()))];
  $('#stage').innerHTML=`<article class="card slide"><div class="kicker">${esc(D.kicker)}</div><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="gl-tools"><label class="search">${ICON.search}<input id="q" type="search" autocomplete="off"></label>
   <div class="seg"><button data-v="list" aria-label="≡">${ICON.list}</button><button data-v="cards" aria-label="▦">${ICON.grid}</button></div></div>
   <div class="abc">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
   <div id="out"></div></article>`;
  function draw(){
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
    document.querySelectorAll('.abc button').forEach(b=>b.classList.toggle('on',b.dataset.l===letter));
    const ql=q.trim().toLowerCase();
    const list=D.entries.map((e,i)=>[e,i]).filter(([e])=>(!letter||e[0][0].toLowerCase()===letter)&&(!ql||(e[0]+' '+e[1]).toLowerCase().includes(ql)));
    const out=$('#out');
    if(!list.length){out.innerHTML='<div class="empty">—</div>';return}
    if(view==='list') out.innerHTML=`<ul class="gl-list">${list.map(([e])=>`<li><div class="t">${esc(e[0])}</div><div class="d">${esc(e[1])}</div></li>`).join('')}</ul>`;
    else{out.innerHTML=`<div class="gl-cards">${list.map(([e,i])=>`<button class="flip${flipped.has(i)?' on':''}" data-i="${i}"><div class="in"><div class="f">${esc(e[0])}</div><div class="b">${esc(e[1])}</div></div></button>`).join('')}</div>`;
      out.querySelectorAll('.flip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;flipped.has(i)?flipped.delete(i):flipped.add(i);c.classList.toggle('on');prog(flipped.size/D.entries.length)})}
  }
  $('#q').oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);draw()});
  document.querySelectorAll('.abc button').forEach(b=>b.onclick=()=>{letter=letter===b.dataset.l?null:b.dataset.l;draw()});
  draw(); prog(0);
}
</script>
</body>
</html>
