<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Манн Ю. Хлестаков и "миражная интрига"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6d6b66; --line:#e3e1db;
  --accent:#2f4b7c; --accent-soft:#e8edf6; --mark:#fbf1c7; --ok:#2e7d5b; --ok-soft:#e3f2ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.app.nosb{grid-template-columns:1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .sp{flex:1}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .35s ease}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
#menuBtn{display:none}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px}
.side .grp{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.side .grp.num{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent)}
.side a{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.side a .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.side a.sub{padding-left:26px;font-size:13.5px;color:var(--muted)}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side a.on .n{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.side a.seen .n{border-color:var(--accent);color:var(--accent)}
/* main */
.main{overflow:auto;position:relative;scroll-behavior:smooth}
.stage{max-width:820px;margin:0 auto;padding:40px 32px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:48px 56px}
.slide{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;line-height:1.5}
.doc-h{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0 0 28px;font-weight:700}
.prose{font-family:var(--serif);font-size:19px;line-height:1.72}
.prose p{margin:0 0 1.05em;text-indent:1.4em;hyphens:auto}
.prose h2{font-family:var(--sans);font-size:22px;font-weight:600;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:inline-block}
.prose h2+p,.prose .part-no+p,.prose p:first-child{text-indent:0}
.prose strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 1px}
.prose em{font-style:italic}
.prose sup.ref{font-family:var(--sans);font-size:.6em;color:var(--muted);vertical-align:super;line-height:0}
.part-no{font-family:var(--serif);font-size:56px;line-height:1;color:var(--accent);margin:0 0 20px;font-weight:700}
.part-no::after{content:"";display:block;width:40px;height:2px;background:var(--accent);margin-top:14px}
/* cover */
.cover{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.cover figure{margin:0}
.cover img{width:100%;border-radius:10px;display:block}
.cover figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:10px;text-indent:0}
.cover figcaption strong{background:none;font-weight:600;color:var(--ink)}
.cover .big{font-family:var(--serif);font-size:20px;letter-spacing:.3em;margin:0 0 22px;color:var(--muted);font-weight:400}
.cover .eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cover .work{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1}
/* pager */
.pager{position:sticky;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 0 18px;margin-top:-80px}
.pager .bar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.pager .cnt{font-size:13px;color:var(--muted);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.pager button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.pager button.next{background:var(--accent);color:var(--panel)}
.pager button:disabled{opacity:.3;cursor:default}
.pager svg{width:20px;height:20px}
/* terms */
.lead{font-family:var(--serif);font-size:19px;line-height:1.65;margin:0 0 26px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.term{display:flex;align-items:center;gap:12px;padding:16px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);font-family:var(--serif);font-size:17.5px;font-weight:700;transition:.2s;user-select:none;text-align:left;width:100%}
.term:hover{border-color:var(--accent)}
.term .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;transition:.2s}
.term .box svg{width:15px;height:15px;opacity:0;color:#fff}
.term.on{border-color:var(--ok);background:var(--ok-soft)}
.term.on .box{background:var(--ok);border-color:var(--ok)}
.term.on .box svg{opacity:1}
.meter{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter .fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.meter .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:18px 22px;border-radius:0 12px 12px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
.callout strong{color:var(--accent)}
/* essay */
.q{border:1px solid var(--line);border-radius:14px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.q-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.q-head .no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.q-head .tx{flex:1;font-family:var(--serif);font-size:18px;line-height:1.5;padding-top:4px}
.q-head .chev{flex:0 0 20px;margin-top:8px;color:var(--muted);transition:transform .25s}
.q.open .chev{transform:rotate(180deg)}
.q-body{display:none;padding:0 20px 20px 70px}
.q.open .q-body{display:block}
.q textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--serif);font-size:17px;line-height:1.6;background:var(--bg);color:var(--ink);resize:vertical}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.q .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:13px;flex:0 0 8px;opacity:0}
.q.has .dot{opacity:1}
/* glossary */
.gl-tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;height:42px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;width:44px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--panel)}
.seg svg{width:19px;height:19px}
.abc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.abc button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--serif);font-size:16px;text-transform:uppercase}
.abc button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gl-list{list-style:none;margin:0;padding:0}
.gl-list li{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.gl-list li:first-child{border-top:0}
.gl-list .t{font-family:var(--serif);font-weight:700;font-size:18px}
.gl-list .d{font-family:var(--serif);font-size:17.5px;line-height:1.55}
.gl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.flip{perspective:1000px;height:180px;cursor:pointer;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel)}
.flip .f{font-family:var(--serif);font-weight:700;font-size:21px}
.flip .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);font-family:var(--serif);font-size:15.5px;line-height:1.45;overflow:auto;align-items:safe center}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:28px}
/* mobile */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  #menuBtn{display:grid}
  .side{position:fixed;top:56px;left:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .app.sbopen .side{transform:none}
  .stage{padding:20px 16px 110px}
  .card{padding:28px 20px;border-radius:12px}
  .prose{font-size:18px}
  .cover{grid-template-columns:1fr;gap:20px}
  .cover figure{max-width:220px}
  .cover .work{font-size:34px}
  .doc-h{font-size:24px}
  .gl-list li{grid-template-columns:1fr;gap:4px}
  .q-body{padding:0 16px 16px}
  .top .crumb,.top .sep{display:none}
}
@media print{
  .top,.side,.pager{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="icon-btn" id="menuBtn" aria-label="☰"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div class="crumb">«РЕВИЗОР» · Ю.В. МАНН</div><div class="sep"></div>
    <div class="ttl">Манн Ю. Хлестаков и "миражная интрига"</div>
    <div class="sp"></div>
    <button class="icon-btn" id="themeBtn" aria-label="◐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <div class="progress" id="prog"></div>
  </header>
  <nav class="side" id="side"></nav>
  <main class="main" id="main"><div class="stage" id="stage"></div></main>
</div>
<script>
const MODE="slides", KEY="Ревизор_04_Манн_Хлестаков_и_миражная_интрига_html", D={"heading": "Манн Ю. Хлестаков и \"миражная интрига\"", "kicker": "Прочитайте фрагменты статьи Ю.В. Манна, посвященные комедии Гоголя “Ревизор”", "pages": [{"group": "", "label": "Гоголь не раз предупреждал: Хлестаков…", "html": "<p>Гоголь не раз предупреждал: Хлестаков — самый трудный образ в пьесе. Почему? Потому что, сделавшись виновником всеобщего обмана, Хлестаков никого не обманывал. Он с успехом сыграл роль ревизора, не только не намереваясь её играть, но даже не поняв, что он её играет. Лишь к середине четвертого действия в голове Хлестакова начинают брезжить смутные догадки, что его принимают за «государственного человека».<\/p><p>Но как раз в непреднамеренности — «сила» Хлестакова. Он говорит, что ничего не выслужил в Петербурге и едет домой в Саратовскую губернию, а Городничий думает: «А? и не покраснеет! О, да с ним нужно ухо востро...», «Врёт, врёт и нигде не оборвётся!». Городничего поразило не «вранье» Хлестакова — он ведь и готовился к тому, что «ревизор» будет играть роль, а то, что он при этом «и не покраснеет». Но Хлестаков говорил чистую правду. Он спровоцировал всю хитроумную игру Городничего и чиновников не хитростью, а чистосердечием. «Подпустим и мы турусы: прикинемся, как будто совсем и не знаем, что он за человек»,— говорит Городничий, полагая, что он подхватывает вызов. А Хлестаков-то и не бросал никакого вызова, он просто говорил и делал рефлекторно то, что требовала от него данная минута.<\/p><p>Страх подготовил почву для обмана. Но обмануло чистосердечие Хлестакова. Опытный плут навряд ли провёл Городничего: он бы его разгадал, но непреднамеренность поступков Хлестакова сбила его с толку. Что-что, а этого он не ожидал!<\/p><p>Интересно, между прочим, что у Хлестакова, в противоположность Городничему и другим, почти совсем нет реплик «в сторону». Такие реплики служили драматургу для передачи внутренней речи персонажа, его тайных намерений. По отношению к Хлестакову этого не требовалось: у него что на уме, то и на языке.<\/p><p>В третьем и четвёртом действиях начинаются головокружительные превращения Хлестакова — воображаемые и реальные. В сцене вранья он — министр и поважнее министра — до фельдмаршала включительно. В сцене приёма чиновников он — взяточник, не очень крупного пошиба, но зато реальный взяточник, извлекающий вполне осязаемую выгоду — в «ассигнациях». Потом — он «высокоблагородная светлость господин финансов», принимающий просьбы и жалобы от населения. Потом — наречённый жених Марьи Антоновны. Переход от воображаемых положений к реальным для Хлестакова нечувствительно лёгок, как переход от «тысячи рублей», которые он вначале запросил у Бобчинского и Добчинского, к сумме, отыскавшейся в карманах обоих приятелей. «Хорошо, пусть будет <em>шестьдесят пять рублей<\/em>. Это всё равно».<\/p><p>«Всё равно» — потому что во всех случаях Хлестаков одинаково непреднамерен; он весь — в пределах данной минуты. Чем эта минута отличается от предыдущей, Хлестаков не спрашивает. Точнее говоря, ему бросаются в глаза некоторые перемены в его положении; но понять, чем они вызваны, он не может. «Мне нравится, что у вас показывают проезжающим всё в городе. В других городах мне ничего не показывали». Уже одно это наблюдение могло навести на мысль, что тут какое-то недоразумение. Но для Хлестакова не существует недоразумений, потому что невозможен даже простейший анализ обстановки. Он — как вода, принимающая форму любого сосуда. У Хлестакова необыкновенная приспособляемость: весь строй его чувств, психики легко и непроизвольно перестраивается под влиянием места и времени.<\/p>"}, {"group": "", "label": "Но во всех случаях — даже…", "html": "<p>Но во всех случаях — даже в минуту самого невероятного вранья — Хлестаков искренен. Выдумывает Хлестаков с тем же чистосердечием, с каким ранее говорил правду,— и это опять обманывает чиновников. Но на этот раз они принимают за истину то, что было вымыслом.<\/p><p>Гоголь писал в «Предуведомлении...»: «Хлестаков, сам по себе, ничтожный человек... Он даже весьма долго но в силах догадаться, отчего к нему такое внимание, уважение. Он почувствовал только приятность и удовольствие, видя, что его слушают, угождают, исполняют всё, что он хочет, ловят с жадностью всё, что ни произносит он... Темы для разговоров ему дают выведывающие. Они сами как бы кладут ему всё в рот и создают разговор. Он чувствует только то, что везде можно хорошо порисоваться, если ничто не мешает» (IV, 116—117).<\/p><p>Касаясь страсти Хлестакова «порисоваться», Гоголь в другом месте подчёркивал: «Хлестаков вовсе не надувает; он не лгун по ремеслу; он сам позабывает, что лжёт, и уже сам почти верит тому, что говорит» («Отрывок из письма, писанного автором вскоре после первого представления «Ревизора»..., IV, 99).<\/p><p>Надо сказать, что вопрос о «вранье» Хлестакова был во времена Гоголя очень важен. Хлестаков как характер застал русских актеров и публику почти врасплох. Его привычно поставили в ряд «вралей» (такую трактовку предложил в Петербурге актер Дюр, а в Москве актер и водевилист Д. Ленский). Новизна гоголевского образа длительное время оставалась тайной.<\/p><p>С тех пор усилиями поколений русских актеров, критиков, исследователей много сделано для правильного понимания Хлестакова. Плодотворны наблюдения в работах последних десятилетий. Так, Г. Гуковский детально показал, что в «сцене вранья» Хлестаков лишь говорит то, чего от него ждут выведывающие. В. Ермилов же отметил, что именно испуг Хлестакова заставил его при первой встрече с Городничим сыграть роль строгого «ревизора».<\/p><p>Поэтому, не останавливаясь более на чистосердечии Хлестакова, обратим внимание на общее значение этого образа и на его место в комедии.<\/p><p>Хлестаков — самый многогранный образ «Ревизора». У Гоголя вообще ни один персонаж не является знаком порока или какого-либо психологического свойства. Ни один из героев пьесы не может быть сведён к одному, определённому качеству, как это часто было в комедии классицизма и Просвещения. Даже в тех случаях, когда такой признак налицо, дело обстоит сложнее. Почтмейстер, говорит Гоголь, «лишь простодушный до наивности человек». Но с каким-то поистине простодушным ехидством он при чтении письма Хлестакова <em>трижды<\/em> повторяет обидное для Городничего: «Городничий глуп, как сивый мерин»,— так что тот в конце концов не выдерживает: «О, чёрт возьми! нужно ещё повторять! как будто оно там и без того не стоит».<\/p><p>Словом, у Гоголя определённое психологическое свойство соотносится с персонажем не как его главная черта, а скорее как диапазон определённых душевных движений. Отсюда — необыкновенная рельефность гоголевских образов при богатстве и глубине их содержания: границы диапазона чётко определены, в то время как внутри его (например, внутри «простодушной наивности» Шпекина) возможны разнообразнейшие оттенки и переходы.<\/p>"}, {"group": "", "label": "Положение Хлестакова среди других персонажей пьесы…", "html": "<p>Положение Хлестакова среди других персонажей пьесы в этом смысле исключительно. Никто другой не может сравниться с ним широтой диапазона. Говоря о важнейшей черте Хлестакова — «желанье порисоваться», Гоголь подчёркивал: «...актер для этой роли должен иметь очень <em>многосторонний<\/em> талант, который бы умел выражать <em>разные<\/em> черты человека, а не какие-нибудь постоянные, одни и те же» («Предуведомление...»). «Черты роли какого-нибудь городничего,— писал Гоголь в «Отрывке из письма...»,— <em>более неподвижны и ясны<\/em>».<\/p><p>Образ Хлестакова неисчерпаем, таит в себе ошеломляющие неожиданности. Однако все они располагаются в пределах одного диапазона.<\/p><p>В 1960 году была опубликована статья С. Сергеева-Ценского о «Ревизоре», в которой доказывалась гениальность Хлестакова. Гениальность Хлестакова не как художественного образа (это само собой разумеется), а как человеческого характера, как «гения-плута», взявшего верх над «талантом — городничим».<\/p><p>«Хлестаков задуман Гоголем не как обыкновенный враль — мели, Емеля, твоя неделя,— а как большой художник, вошедший в роль именно того, за кого его принимают в городишке.<\/p><p>“Вы все хотите чрезвычайно, чтобы я был именно тот самый ревизор... что ж, извольте, братцы: итак — я ревизор!” — как бы говорит всем и каждому Хлестаков... И вот он развёртывает всю свою (гоголевскую) богатейшую фантазию... Уж ежели врать, так врать: врать колоссально, гомерически»<sup class=\"ref\">[1]<\/sup>.<\/p><p>Например, пассаж об арбузе. «Давайте вникнем в этот полёт фантазии,— продолжает Сергеев-Ценский.— Во-первых, что это за арбуз в 700 рублей... За 700 рублей можно было купить целую гору арбузов... А во что может превратиться сваренный в Париже суп, пока его довезут на пароходе в Петербург? Такие обыденные вопросы гением отметаются».<\/p><p>Надо сразу же отвести мнение С. Сергеева-Ценского о целенаправленности и продуманности поступков Хлестакова («...итак, я — ревизор!»). Характерно, что в черновой редакции Хлестаков говорил себе, при появлении Городничего: «...не поддаваться. Ей-богу, не поддаваться». Но Гоголь затем снял эту фразу: ставить перед собою какую-нибудь задачу не в природе Хлестакова. Где уж там говорить о «стратегическом» плане на более длительное время!<\/p><p>Что же касается отождествления: Хлестаков — гений, то оно правильно лишь как парадокс, то есть неожиданное сближение внешних признаков при несходстве сущности.<\/p><p>Хлестаков «гениален» исключительной лёгкостью и «незаданностью» выдумки. Благодаря этому ему удаётся то, что не удалось бы никакому просто «талантливому» выдумщику. Марья Антоновна вспоминает, что приписанный Хлестаковым себе «Юрий Милославский» — «это г. Загоскина сочинение». Положение создалось безнадёжное, но Хлестаков выходит из него гениально просто: «Это правда, это точно Загоскина; а есть другой Юрий Милославский, так тот уж мой». Спасает полнейшая незаданность поступков Хлестакова и то чистосердечие, о котором говорилось выше.<\/p><p>Затем: можно ли сказать, что воображение Хлестакова гениально смело? Почему, в самом деле, «арбуз в 700 рублей»? Ведь на эту сумму можно приобрести не только гору арбузов, но просто — вещи более изысканные. Но их-то Хлестаков не знает, а вообразить не может,— и предлагает арбуз, <em>но<\/em> за 700 рублей.<\/p>"}, {"group": "", "label": "Словом, нигде Хлестаков не выходит за…", "html": "<p>Словом, нигде Хлестаков не выходит за пределы своего кругозора, своего уровня понимания. Его воображение страшно убого, но дерзко, смело в своей убогости — гениально убого. Да и сам Хлестаков гениально пуст, гениально тривиален. Разносторонность характера возникает от глубины его разработки, от определённости диапазона.<\/p><p>Но что же это за диапазон, если говорить о Хлестакове? В то время, как главное свойство других персонажей «Ревизора» Гоголь ещё определял кратко, одной формулой (например, «простодушие» почтмейстера, любопытство и болтливость Бобчинского и Добчинского), то преобладающую «заботу» Хлестакова передавал только описательно: «Актёр особенно не должен упустить из виду это желанье порисоваться, которым более или менее заражены все люди...» и т. д.<\/p><p>Лживость ли это Хлестакова? Но мы знаем, что он лжёт чистосердечно. Хвастливость? Но он верит сам в то, что говорит... Какими бы установившимися понятиями ни мерить характер Хлестакова, всё время сталкиваешься с их недостаточностью и неточностью. Поневоле приходишь к выводу, что самым точным и всеобъемлющим будет определение, производное от имени самого персонажа, — хлестаковщина.<\/p><p>Гоголь открыл определённое явление, и вот почему это явление может быть названо только тем именем, которое дал ему писатель.<\/p><p>«Всякий хоть на минуту, если не на несколько минут, делался или делается Хлестаковым... И ловкий гвардейский офицер окажется иногда Хлестаковым, и государственный муж окажется иногда Хлестаковым, и наш брат, грешный литератор, окажется подчас Хлестаковым...» («Отрывок из письма...»). В таком духе Гоголь говорил о собирательности героев «Мёртвых душ» — о Коробочке или Ноздреве.<\/p><p>Хотя каждый из персонажей «Ревизора» нов и оригинален, но Хлестаков — первое из художественных открытий Гоголя мирового класса. Этим объясняется и особое место Хлестакова в развитии «ситуации ревизора».<\/p>"}, {"group": "2", "label": "Хлестакова недостаточно противопоставлять только персонажам водевиля…", "html": "<div class=\"part-no\">2<\/div><p>Хлестакова недостаточно противопоставлять только персонажам водевиля — «водевильным шалунам». Гоголь, говоря о том, что Хлестаков в исполнении Дюра «сделался обыкновенным вралем», пояснял: «бледное лицо, <em>в продолжениедвух столетий<\/em> являющееся в одном и том же костюме» («Отрывок из письма...»). Но такой срок выводит традицию далеко за пределы водевиля<sup class=\"ref\">[2]<\/sup>.<\/p><p>Подобно тому как «ситуацию ревизора» Гоголь противополагал ситуации хитроумных влюблённых, так и тип Хлестакова создавался им в отталкивании от устойчивого образа комедийного плута и выдумщика. «Два столетия» традиции ведут к мольеровским Скапену, Сганарелю (из «Лекаря поневоле», 1666), к Маскарилю (из «Смешных жеманниц», 1659) и т. д., а от них — хотя для Гоголя, возможно, уже но существовала эта связь — к хитроумным «дзани» комедии дель арте и древнее, вплоть до персонажей новоаттической комедии. Тип «водевильного шалуна», кстати, был боковым ответвлением этой давней традиции.<\/p><p>Хлестаков противостоял комедийному плуту, во-первых, как тип ненадувающего лжеца, не преследующего в игре определённой, заранее поставленной перед собою цели. Осмыслить хлестаковщину как новое явление можно было, лишь полностью оторвав его от традиций, — и такой отрыв действительно демонстрирует Гоголь и своими теоретическими суждениями о Хлестакове, и своей работой над образом, при которой из психологического комплекса героя последовательно вытравлялись инородные примеси<sup class=\"ref\">[3]<\/sup>. Это прежде всего малейшие намеки на самостоятельный почин, волю Хлестакова. Чем безынициативнее и «аморфнее» вёл себя Хлестаков, тем глубже раскрывались в нём обыденные, пошлые, низкие «элементы» жизни.<\/p><p>Вместе с тем изменялась и роль персонажа в ситуации. Традиционный комедийный плут ведёт, как говорят, активную интригу. Комедийное действо проистекает из его воли, стимулируется ею. Это наглядно видно в комедии хитроумных влюблённых, где благодаря обдуманным и целенаправленным поступкам Бригеллы и Арлекина, Скапена, Маскариля и т. д. влюблённые соединяются, а их противники терпят поражение. Действует ли плут в интересах своего господина, как Скапен, или в своих собственных, как Криспен (из комедии Лесажа «Криспен — соперник своего господина», 1707), отличается ли он полной безнравственностью и аморальностью (подобно тому же Криспену), или же, как Фигаро у Бомарше, воплощает некоторые лучшие черты «своей нации»,— это не меняет характера самой интриги.<\/p><p>Таким образом, русские писатели до Гоголя воспользовались для разработки «ситуации ревизора» традиционным образом плута. Последний (в роли мнимого ревизора) вёл активную интригу комедии. Можно предположить, что так должно было быть у Пушкина, судя по его очень краткому наброску сюжета и по обозначению главного героя — Криспин<sup class=\"ref\">[4]<\/sup>.<\/p><p>Но Гоголь, мы говорили, усложняет ситуацию. Поместив в фокус комедии Хлестакова, он осветил всё её действие дополнительным светом. Характер Хлестакова в корне меняет сущность интриги, хотя по видимости всё остаётся без изменении.<\/p><p>И. Кронеберг, отражая традиционный взгляд на единство драмы, писал: «Главное лицо драматического творения есть центр пьесы. Около него обращаются все прочие лица, как планеты около Солнца. Притягательная сила центра не позволяет им разобщиться; сколь далеко ни отступают, к центру возвратиться должны»<sup class=\"ref\">[5]<\/sup>.<\/p>"}, {"group": "2", "label": "Хлестаков — центр ситуации («Не нужно…", "html": "<p>Хлестаков — центр ситуации («Не нужно только позабывать того, что в голове всех сидит ревизор...»). Но центр не настоящий, а как бы заменяющей настоящий.<\/p><p>Хлестакову принадлежит главная роль в действии. Около него «обращаются все прочие лица, как планеты около Солнца». Но он не ведёт действие комедии, а <em>как бы<\/em> ведет.<\/p><p>С участием Хлестакова в комедии происходят чрезвычайно важные события. Возникает вначале угроза Городничему и другим чиновникам; потом опасность сглаживается и намечается, если употребить термин Аристотеля, «перемена от несчастья к счастью<sup class=\"ref\">[6]<\/sup>, и вот уже маячит вдалеке, перед семейством Городничего само «счастье»...<\/p><p>Вокруг Хлестакова поднимается вихрь мнений, догадок, ощущений; возникает соперничество, зависть, искательство, любопытство — и над всем приподнято-тревожное, давящее чувство — страх!..<\/p><p>К Хлестакову обращены надежды и просьбы о помощи, с его именем связываются чаяния десятков и сотен людей, находящихся за сценой — всех обитателей потревоженного города.<\/p><p>А оказалось-то, что вся постройка возводилась на гнилом фундаменте и в одно мгновение рухнула. Даже и не на «гнилом фундаменте»: ведь Хлестаков ни в малейшей мере не собирался и не мог присвоить себе тех прерогатив, которые с ним связывались. Вместо опоры просто ничего не оказалось. «Совершенно гладкое место», как говорится в «Носе».<\/p><p>Положение Городничего и других чиновников после разоблачения Хлестакова «трагическое», говорит Гоголь. Допустим, что наше сострадание к ним приглушено до минимума: чиновники получили по заслугам. Но ведь развеяны надежды, мечтания и тех, кто пришёл искать у Хлестакова защиты и думал, что нашел её. Разве можно не видеть, что разоблачение «ревизора» — это удар по всему «испуганному городу»?<\/p><p>Действие «Ревизора» трагично: оно развивается в убыстряющемся темпе и целенаправленно. Но цель заранее убрана.<\/p><p>О теме «миражной жизни» у Гоголя хорошо сказал Ап. Григорьев, связав эту тему с особенностями русской действительности: «Форма без содержания, движение без цели, внешность интересов и, стало быть, пустота их,— узкие цели деятельности, поглощающейся в бесплодном формализме... всё это гордящееся чем-то, к чему-то неугомонно стремящееся, толкающее по пути другое, толкающее без сердца и без жалости...<\/p><p>Страшная, мрачная картина...»<\/p><p>Далее Ап. Григорьев писал: «Углубляясь в свой анализ пошлости пошлого человека, поддерживаемой и питаемой миражною жизнию, он &lt;Гоголь&gt; додумался до Хлестакова, этого невыполнимого никаким великим актером типа... потому что тип есть нечто собирательное и фантастическое, как нос майора Ковалёва...»<sup class=\"ref\">[7]<\/sup><\/p><p>Нельзя было лучше передать дух миражной жизни, чем создав <em>миражную интригу<\/em> комедии.<\/p><p>Номинально стоя во главе действия, Хлестаков сам является его игрушкой. В литературе о «Ревизоре» отмечалось, что возвышением Хлестакова разоблачается тема власти: если такое ничтожество может с успехом замещать «вельможу», то легко установить истинную стоимость последнего. Это правильно, но мысль комедии (если читать её так, как она выразилась в форме, в «поэтике») глубже. Не забудем, что Хлестаков бессознательно играет роль «ревизора». Было ли в нём хоть что-нибудь от вельможи? Наконец, хотя бы старания добиться этой роли? «Ну, что было в этом вертопрахе похожего на ревизора? Ничего не было. Вот просто ни на полмизинца не было похожего»,— говорит Городничий. И он, конечно, во многом прав.<\/p>"}, {"group": "2", "label": "«Миражность» возвышения Хлестакова в том, что…", "html": "<p>«Миражность» возвышения Хлестакова в том, что он играет роль, к которой меньше всего способен, меньше всего достоин и которой в известном смысле (в смысле практического, обдуманного желания) меньше всего добивался.<\/p><p>Противопоставляя «толстых» и «тоненьких» в «Мёртвых душах», Гоголь писал, что «толстые умеют лучше на этом свете обделывать дела свои, нежели тоненькие», что «толстые» сидят везде «надежно и крепко», а «тоненькие» — «виляют туда и сюда» и т. д. Всё дело в том, однако, что нетонкий Чичиков («ни слишком толст, ни слишком тонок») терпит одно поражение за другим и не наживается. Тонкий же, как спичка, Хлестаков увозит из города солидный оброк<sup class=\"ref\">[8]<\/sup>.<\/p><p>Может случиться, конечно, что Хлестаков так и не довезёт его до дому и спустит в игре с «бестией», пехотным капитаном. Но в пределах данного отрезка времени «счастлив» Хлестаков. Обманул не жулик по ремеслу. Нажился не опытный приобретатель. Не «толстый», умеющий «обделывать дела свои».<\/p><p>Миражная жизнь вынесла на гребень волны «сосульку», а что с нею случится в следующее мгновение, говорить пока рано.<\/p><p>«Как странно, как непостижимо играет нами судьба наша! Получаем ли мы когда-нибудь то, чего желаем? Достигаем ли мы того, к чему, кажется, нарочно приготовлены наши силы? Всё происходит наоборот» («Невский проспект»).<\/p><p>«Всё происходит наоборот» и в «Ревизоре» — и поэтому не ведущему, не определяющему интригу Хлестакову Гоголь отводит главное место в комедии.<\/p><p>Отметим важнейший момент: в «Ревизоре» миражная интрига соединилась с тенденцией к предельному обобщению. Иначе говоря, миражная интрига действует в пределах «сборного города», «ненастоящность» ревизора обнаруживается внутри общей и единой «ситуации ревизора». Чисто гоголевское тончайшее соединение несоединимого!<\/p><p>Возвращаясь к Хлестакову, надо сказать, что в некоторых сценических интерпретациях этого образа заключённые в нём черты «миражности» усиливались подчас до «ненормальности». Об исполнении роли замечательным актером М.А. Чеховым врач Н. Семашко писал: «В изображении артиста Чехова мы имеем несомненно психопатологический тип... У него ярко выраженное расстройство ассоциаций: следующие друг за другом звенья идей прерываются, перескакивают. Возбуждение быстро нарастает и столь же быстро и исчезает; страх быстро сменяется возбуждением... Наблюдается «аффективное отупение» (долгий тупой взгляд при появлении женщин в доме городничего). Итак, Чехов выводит в Хлестакове дегенерата, страдающего преждевременным слабоумием, выводит тонко, с чисто психиатрическими деталями»<sup class=\"ref\">[9]<\/sup>.<\/p><p>Значительность и правомерность такой интерпретации, разумеется, вне сомнения. Бесспорно также и то, что актёр развивал «готовности», заложенные в самом образе. Однако эффект алогизма создаётся у Гоголя несколько иным способом — сочетанием внешне несочетаемого.<\/p><p>Гоголевский Хлестаков вовсе не ненормален, он весь в пределах нормы. В нём «ничего но должно быть означено резко». Беспросветно глуп — но это другое дело, Гротесков (если понимать под гротеском не преувеличение, а алогизм) не характер Хлестакова, а та роль, которая ему выпала. Те силы, которые управляют его судьбой и судьбой других героев комедии. Гротескна миражная жизнь.<\/p>"}, {"group": "2", "label": "В судьбе Хлестакова только сильнее выразилась…", "html": "<p>В судьбе Хлестакова только сильнее выразилась игра этих сил. Он, по слову Гоголя,— «лживый, олицетворенный обман» («Предуведомление...»). Отсюда особенность пьесы: чем яснее — в последних сценах — вырисовывается для других персонажей подлинное лицо Хлестакова, тем более возрастает его роль. Но по-прежнему роль не как двигателя интриги, а как символа её миражности, «олицетворённого обмана».<\/p><p>Ведь почему так поражён, разбит Городничий после чтения письма Хлестакова? Почему он так болезненно переживает то, что его обманули?<\/p><p>Произошло что-то непонятное, странное для него. Если бы его провёл мошенник, он бы так не переживал. Это было бы в порядке вещей. А тут нарушены привычные измерения и нормы, которые годами укладывались в его голове. Всё вдруг перевернулось вверх дном. «Ничего не вижу. Вижу какие-то свиные рылы, вместо лиц; а больше ничего...» Сбиты с толку и другие персонажи. «Уж как это случилось, хоть убей, не могу объяснить. Точно туман какой-то ошеломил, чёрт попутал»,— говорит Артемий Филиппович.<\/p><p>Словом, с раскрытием обмана Хлестакова мы всё более чувствуем, что комедия переходит — перешла уже — в трагедию. Жизнь вышла из колеи. Те кратковременные силы общности, которые возникли в «ситуации ревизора», перестают действовать. Будущее грозит ещё большим раздроблением, и нужно либо констатировать это распадение, либо, в последний раз, насильно, попытаться удержать целое.<\/p><p>И тут следует появление жандарма с известием о настоящем ревизоре и немая сцена, когда, как гласит ремарка, «вся группа, вдруг переменивши положенье, остаётся в окаменении».<\/p>"}]};

 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
};
/* theme */
(function(){const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t;
 $('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#151618';
  const n=dark?'light':'dark';document.documentElement.dataset.theme=n;store.set('theme',n)};})();
$('#menuBtn').onclick=()=>$('#app').classList.toggle('sbopen');
const prog=p=>$('#prog').style.width=(p*100)+'%';

/* ---------- slides ---------- */
if(MODE==='slides'){
  const P=D.pages; let cur=Math.min(store.get('pos',0),P.length-1); let seen=new Set(store.get('seen',[]));
  const side=$('#side'); let h=''; let lastG=null;
  const gcount={}; P.forEach(p=>{if(p.group)gcount[p.group]=(gcount[p.group]||0)+1});
  P.forEach((p,i)=>{
    const multi=p.group&&gcount[p.group]>1;
    if(p.group!==lastG&&p.group&&(multi||/^\d$/.test(p.group))){
      if(!(multi&&p.label===p.group)) h+=`<div class="grp${/^\d$/.test(p.group)?' num':''}">${esc(p.group)}</div>`;
    }
    lastG=p.group;
    const sub=multi&&p.label!==p.group;
    h+=`<a data-i="${i}" class="${sub?'sub':''}"><span class="n">${i+1}</span><span>${esc(p.label)}</span></a>`;
  });
  side.innerHTML=h;
  side.onclick=e=>{const a=e.target.closest('a');if(a){go(+a.dataset.i);$('#app').classList.remove('sbopen')}};
  function go(i){
    if(i<0||i>=P.length)return; cur=i; seen.add(i); store.set('pos',i); store.set('seen',[...seen]);
    const head=(i===0&&D.heading)?`${D.kicker?`<div class="kicker">${esc(D.kicker)}</div>`:''}<h1 class="doc-h">${esc(D.heading)}</h1>`:'';
    $('#stage').innerHTML=`<article class="card slide">${head}<div class="prose">${P[i].html}</div></article>`;
    $('#main').insertAdjacentHTML('beforeend','');
    pager.querySelector('.cnt').textContent=`${i+1} / ${P.length}`;
    pager.querySelector('.prev').disabled=i===0; pager.querySelector('.next').disabled=i===P.length-1;
    side.querySelectorAll('a').forEach(a=>{const k=+a.dataset.i;a.classList.toggle('on',k===i);a.classList.toggle('seen',seen.has(k)&&k!==i)});
    const on=side.querySelector('a.on'); if(on)on.scrollIntoView({block:'nearest'});
    $('#main').scrollTo({top:0,behavior:'instant'}); prog((i+1)/P.length);
  }
  const pager=document.createElement('div'); pager.className='pager';
  pager.innerHTML=`<div class="bar"><button class="prev" aria-label="←">${ICON.l}</button><span class="cnt"></span><button class="next" aria-label="→">${ICON.r}</button></div>`;
  $('#main').appendChild(pager);
  pager.querySelector('.prev').onclick=()=>go(cur-1); pager.querySelector('.next').onclick=()=>go(cur+1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  go(cur);
}

/* ---------- terms ---------- */
if(MODE==='terms'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let on=new Set(store.get('on',[]));
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <p class="lead">${D.intro}</p>
   <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="val" id="val"></div></div>
   <ul class="terms">${D.terms.map((t,i)=>`<li><button class="term" data-i="${i}"><span class="box">${ICON.chk}</span><span>${esc(t)}</span></button></li>`).join('')}</ul>
   <div class="callout">${D.outro}</div></article>`;
  function upd(){document.querySelectorAll('.term').forEach(b=>b.classList.toggle('on',on.has(+b.dataset.i)));
    const p=on.size/D.terms.length;$('#fill').style.width=p*100+'%';$('#val').textContent=`${on.size} / ${D.terms.length}`;prog(p);store.set('on',[...on])}
  document.querySelectorAll('.term').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);upd()});
  upd();
}

/* ---------- essay ---------- */
if(MODE==='essay'){
  $('#app').classList.add('nosb'); $('#side').remove();
  const drafts=store.get('drafts',{});
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="callout" style="margin-bottom:28px">${D.intro}</div>
   ${D.questions.map((q,i)=>`<div class="q" data-i="${i}"><button class="q-head">${D.numbered?`<span class="no">${i+1}</span>`:''}<span class="tx">${q}</span><span class="dot"></span><span class="chev">${ICON.chev}</span></button>
     <div class="q-body"><textarea spellcheck="true" aria-label="${i+1}"></textarea></div></div>`).join('')}</article>`;
  function upd(){let n=0;document.querySelectorAll('.q').forEach(q=>{const has=!!(drafts[q.dataset.i]||'').trim();q.classList.toggle('has',has);if(has)n++});prog(n/D.questions.length)}
  document.querySelectorAll('.q').forEach(q=>{const i=q.dataset.i,ta=q.querySelector('textarea');ta.value=drafts[i]||'';
    q.querySelector('.q-head').onclick=()=>{q.classList.toggle('open');if(q.classList.contains('open'))ta.focus()};
    ta.oninput=()=>{drafts[i]=ta.value;store.set('drafts',drafts);upd()}});
  upd();
}

/* ---------- glossary ---------- */
if(MODE==='glossary'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let view=store.get('view','list'), letter=null, q='', flipped=new Set();
  const letters=[...new Set(D.entries.map(e=>e[0][0].toLowerCase()))];
  $('#stage').innerHTML=`<article class="card slide"><div class="kicker">${esc(D.kicker)}</div><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="gl-tools"><label class="search">${ICON.search}<input id="q" type="search" autocomplete="off"></label>
   <div class="seg"><button data-v="list" aria-label="≡">${ICON.list}</button><button data-v="cards" aria-label="▦">${ICON.grid}</button></div></div>
   <div class="abc">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
   <div id="out"></div></article>`;
  function draw(){
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
    document.querySelectorAll('.abc button').forEach(b=>b.classList.toggle('on',b.dataset.l===letter));
    const ql=q.trim().toLowerCase();
    const list=D.entries.map((e,i)=>[e,i]).filter(([e])=>(!letter||e[0][0].toLowerCase()===letter)&&(!ql||(e[0]+' '+e[1]).toLowerCase().includes(ql)));
    const out=$('#out');
    if(!list.length){out.innerHTML='<div class="empty">—</div>';return}
    if(view==='list') out.innerHTML=`<ul class="gl-list">${list.map(([e])=>`<li><div class="t">${esc(e[0])}</div><div class="d">${esc(e[1])}</div></li>`).join('')}</ul>`;
    else{out.innerHTML=`<div class="gl-cards">${list.map(([e,i])=>`<button class="flip${flipped.has(i)?' on':''}" data-i="${i}"><div class="in"><div class="f">${esc(e[0])}</div><div class="b">${esc(e[1])}</div></div></button>`).join('')}</div>`;
      out.querySelectorAll('.flip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;flipped.has(i)?flipped.delete(i):flipped.add(i);c.classList.toggle('on');prog(flipped.size/D.entries.length)})}
  }
  $('#q').oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);draw()});
  document.querySelectorAll('.abc button').forEach(b=>b.onclick=()=>{letter=letter===b.dataset.l?null:b.dataset.l;draw()});
  draw(); prog(0);
}
</script>
</body>
</html>
