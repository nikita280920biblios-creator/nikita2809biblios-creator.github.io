<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --ink:#221f1c;
    --ink-soft:#5c564e;
    --wine:#7c2d3b;
    --gold:#a3823f;
    --hair:#e7e2d8;
    --hair-strong:#d8d1c2;
    --max:660px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--white);
    color:var(--ink);
    font-family:'PT Serif', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  main{
    max-width:var(--max);
    margin:0 auto;
    padding:100px 28px 140px;
  }
  .frontispiece{
    text-align:center;
    margin-bottom:80px;
    animation:rise .9s ease both;
  }
  .frontispiece .kicker{
    font-family:'PT Serif', serif;
    font-style:italic;
    color:var(--ink-soft);
    font-size:15px;
    letter-spacing:.02em;
    margin:0 0 18px;
  }
  .frontispiece h1{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(26px, 4.4vw, 40px);
    line-height:1.28;
    margin:0;
  }
  .frontispiece .rule{
    width:64px;
    height:1px;
    background:var(--gold);
    margin:26px auto 0;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .prose{font-size:17px; line-height:1.85;}
  .prose p{margin:0 0 24px;}
  .prose p:last-child{margin-bottom:0;}

  .outline{margin:0;padding:0;}
  .item{
    display:grid;
    grid-template-columns:38px 1fr;
    gap:6px 16px;
    margin:0 0 26px;
  }
  .item .num{
    font-family:'Playfair Display', serif;
    font-style:italic;
    color:var(--wine);
    font-size:19px;
    line-height:1.6;
    text-align:right;
  }
  .item .body{font-size:17px; line-height:1.75; color:var(--ink);}
  .item .body > p{margin:0 0 12px;}
  .item .body > p:last-child{margin-bottom:0;}

  .sub{
    margin:14px 0 0; padding:0; list-style:none;
    display:grid; gap:16px;
  }
  .sub > li{
    display:grid; grid-template-columns:26px 1fr; gap:12px;
  }
  .sub > li > .n{
    color:var(--ink-soft); font-style:italic;
    font-family:'Playfair Display', serif; font-size:17px;
    text-align:right; line-height:1.75;
  }
  .sub > li > .s{font-size:17px; line-height:1.75;}
  .sub > li > .s > p{margin:0 0 8px;}
  .sub > li > .s > p:last-child{margin-bottom:0;}

  .lettered{
    margin:10px 0 0; padding:0; list-style:none;
    display:grid; gap:10px;
  }
  .lettered > li{
    display:grid; grid-template-columns:24px 1fr; gap:10px;
    font-size:16.5px; line-height:1.7; color:var(--ink-soft);
  }
  .lettered > li > .l{
    font-style:italic; font-family:'Playfair Display', serif;
    color:var(--gold); text-align:right;
  }

  figure{margin:44px 0 46px; text-align:center;}
  figure img{
    max-width:100%; height:auto; cursor:zoom-in;
    filter:sepia(6%); border:1px solid var(--hair);
    transition:box-shadow .3s ease, transform .3s ease;
  }
  figure img:hover{box-shadow:0 12px 34px -18px rgba(34,31,28,.35); transform:translateY(-2px);}
  figure.portrait img{max-width:260px;}
  figure figcaption{
    margin-top:12px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:13.5px;
    color:var(--ink-soft);
  }

  .gallery{
    display:grid; grid-template-columns:1fr 1fr;
    gap:32px; margin:52px 0 56px;
  }
  .gallery figure{margin:0;}
  .gallery .frame{padding:8px; border:1px solid var(--hair); background:var(--white);}
  .gallery img{
    display:block; width:100%; height:220px; object-fit:cover;
    filter:sepia(6%); cursor:zoom-in; transition:transform .3s ease;
  }
  .gallery img:hover{transform:scale(1.015);}
  .gallery figcaption{
    margin-top:12px; font-family:'Playfair Display', serif;
    font-style:italic; font-size:13.5px; color:var(--ink-soft);
  }

  h2.section-head{
    font-family:'Playfair Display', serif;
    font-weight:500;
    font-style:italic;
    font-size:23px;
    color:var(--ink);
    margin:64px 0 26px;
    padding-bottom:14px;
    border-bottom:1px solid var(--hair);
  }
  h2.section-head:first-of-type{margin-top:0;}

  .divider-thin{width:36px; height:1px; background:var(--gold); margin:6px 0 26px;}

  .lightbox{
    position:fixed; inset:0; background:rgba(20,18,16,.86);
    display:none; align-items:center; justify-content:center;
    z-index:50; cursor:zoom-out; padding:40px;
    flex-direction:column; gap:14px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:min(92vw, 700px); max-height:82vh; box-shadow:0 30px 80px rgba(0,0,0,.5);}
  .lightbox .lb-cap{font-family:'Playfair Display', serif; font-style:italic; color:#f1ede4; font-size:14px;}

  @media (max-width:640px){
    main{padding:70px 20px 100px;}
    .item{grid-template-columns:28px 1fr; gap:4px 10px;}
    .sub > li{grid-template-columns:22px 1fr;}
    .lettered > li{grid-template-columns:20px 1fr;}
    .frontispiece{margin-bottom:56px;}
    .gallery{grid-template-columns:1fr; gap:36px;}
    .gallery img{height:280px;}
  }
</style>
</head>
<body>
<main>

<div class="frontispiece">
  <h1>Задание</h1>
  <div class="rule"></div>
</div>

<div class="prose">
  <p>Составить таблицу «Эпиграфы в романе».</p>
</div>

<div class="outline">
  <div class="item"><span class="num">1.</span><div class="body"><p>Номер главы</p></div></div>
  <div class="item"><span class="num">2.</span><div class="body"><p>Название главы</p></div></div>
  <div class="item"><span class="num">3.</span><div class="body"><p>Эпиграфы к ней</p></div></div>
  <div class="item"><span class="num">4.</span><div class="body"><p>Комментарии к эпиграфам (откуда взяты, в чем смысл, какова функция).</p></div></div>
</div>

<div class="prose" style="margin-top:8px;">
  <p>В романе 17 эпиграфов.</p>
  <p>Особое внимание уделите основному эпиграфу.</p>
</div>

</main>

</body>
</html>
