<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебный текст «Шинель»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6d6b66; --line:#e3e1db;
  --accent:#2f4b7c; --accent-soft:#e8edf6; --mark:#fbf1c7; --ok:#2e7d5b; --ok-soft:#e3f2ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.app.nosb{grid-template-columns:1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .sp{flex:1}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .35s ease}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
#menuBtn{display:none}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px}
.side .grp{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.side .grp.num{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent)}
.side a{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.side a .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.side a.sub{padding-left:26px;font-size:13.5px;color:var(--muted)}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side a.on .n{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.side a.seen .n{border-color:var(--accent);color:var(--accent)}
/* main */
.main{overflow:auto;position:relative;scroll-behavior:smooth}
.stage{max-width:820px;margin:0 auto;padding:40px 32px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:48px 56px}
.slide{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;line-height:1.5}
.doc-h{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0 0 28px;font-weight:700}
.prose{font-family:var(--serif);font-size:19px;line-height:1.72}
.prose p{margin:0 0 1.05em;text-indent:1.4em;hyphens:auto}
.prose h2{font-family:var(--sans);font-size:22px;font-weight:600;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:inline-block}
.prose h2+p,.prose .part-no+p,.prose p:first-child{text-indent:0}
.prose strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 1px}
.prose em{font-style:italic}
.prose sup.ref{font-family:var(--sans);font-size:.6em;color:var(--muted);vertical-align:super;line-height:0}
.part-no{font-family:var(--serif);font-size:56px;line-height:1;color:var(--accent);margin:0 0 20px;font-weight:700}
.part-no::after{content:"";display:block;width:40px;height:2px;background:var(--accent);margin-top:14px}
/* cover */
.cover{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.cover figure{margin:0}
.cover img{width:100%;border-radius:10px;display:block}
.cover figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:10px;text-indent:0}
.cover figcaption strong{background:none;font-weight:600;color:var(--ink)}
.cover .big{font-family:var(--serif);font-size:20px;letter-spacing:.3em;margin:0 0 22px;color:var(--muted);font-weight:400}
.cover .eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cover .work{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1}
/* pager */
.pager{position:sticky;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 0 18px;margin-top:-80px}
.pager .bar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.pager .cnt{font-size:13px;color:var(--muted);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.pager button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.pager button.next{background:var(--accent);color:var(--panel)}
.pager button:disabled{opacity:.3;cursor:default}
.pager svg{width:20px;height:20px}
/* terms */
.lead{font-family:var(--serif);font-size:19px;line-height:1.65;margin:0 0 26px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.term{display:flex;align-items:center;gap:12px;padding:16px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);font-family:var(--serif);font-size:17.5px;font-weight:700;transition:.2s;user-select:none;text-align:left;width:100%}
.term:hover{border-color:var(--accent)}
.term .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;transition:.2s}
.term .box svg{width:15px;height:15px;opacity:0;color:#fff}
.term.on{border-color:var(--ok);background:var(--ok-soft)}
.term.on .box{background:var(--ok);border-color:var(--ok)}
.term.on .box svg{opacity:1}
.meter{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter .fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.meter .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:18px 22px;border-radius:0 12px 12px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
.callout strong{color:var(--accent)}
/* essay */
.q{border:1px solid var(--line);border-radius:14px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.q-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.q-head .no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.q-head .tx{flex:1;font-family:var(--serif);font-size:18px;line-height:1.5;padding-top:4px}
.q-head .chev{flex:0 0 20px;margin-top:8px;color:var(--muted);transition:transform .25s}
.q.open .chev{transform:rotate(180deg)}
.q-body{display:none;padding:0 20px 20px 70px}
.q.open .q-body{display:block}
.q textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--serif);font-size:17px;line-height:1.6;background:var(--bg);color:var(--ink);resize:vertical}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.q .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:13px;flex:0 0 8px;opacity:0}
.q.has .dot{opacity:1}
/* glossary */
.gl-tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;height:42px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;width:44px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--panel)}
.seg svg{width:19px;height:19px}
.abc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.abc button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--serif);font-size:16px;text-transform:uppercase}
.abc button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gl-list{list-style:none;margin:0;padding:0}
.gl-list li{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.gl-list li:first-child{border-top:0}
.gl-list .t{font-family:var(--serif);font-weight:700;font-size:18px}
.gl-list .d{font-family:var(--serif);font-size:17.5px;line-height:1.55}
.gl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.flip{perspective:1000px;height:180px;cursor:pointer;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel)}
.flip .f{font-family:var(--serif);font-weight:700;font-size:21px}
.flip .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);font-family:var(--serif);font-size:15.5px;line-height:1.45;overflow:auto;align-items:safe center}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:28px}
/* mobile */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  #menuBtn{display:grid}
  .side{position:fixed;top:56px;left:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .app.sbopen .side{transform:none}
  .stage{padding:20px 16px 110px}
  .card{padding:28px 20px;border-radius:12px}
  .prose{font-size:18px}
  .cover{grid-template-columns:1fr;gap:20px}
  .cover figure{max-width:220px}
  .cover .work{font-size:34px}
  .doc-h{font-size:24px}
  .gl-list li{grid-template-columns:1fr;gap:4px}
  .q-body{padding:0 16px 16px}
  .top .crumb,.top .sep{display:none}
}
@media print{
  .top,.side,.pager{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .card{box-shadow:none;border:0;padding:0}
}
</style>
</head>

    <div class="progress" id="prog"></div>
  </header>

  <main class="main" id="main"><div class="stage" id="stage"></div></main>
</div>

по проблематике к повестям «Арабесок» и завершая гоголевский цикл «петербургских повестей», «Шинель» перекликается с идеями и образами «Мертвых душ». <strong>Шедевр реалистической прозы<\/strong>; по словам Белинского, «одно из глубочайших созданий Гоголя». В повести создан <strong>тип «маленького человека»<\/strong>, к которому перешла маниакальная страсть романтических героев, получив, однако, сугубо земную мотивировку. <strong>Пафос гуманности<\/strong>, сострадания к ближнему. В произведении создан образ города – имперской столицы – средоточия бездушия, автоматизма, механистичности. Антагонист главного героя – «значительное лицо» - представляет иерархическую бюрократическую машину в действии. <strong>Город<\/strong> в «Шинели» - это сфера действия страшных, беспощадных к человеку сил (мотив предопределенности в предыстории героя). Особенно резко враждебность Петербурга к «маленькому человеку» проявлена в финале повести, который разработан в стиле нефантастической фантастики. «Шинель» в петербургском цикле Гоголя больше всего связана с традицией А.С.Пушкина.<\/p>"}, {"group": "", "label": "История создания", "html": "<h2>История создания<\/h2><p>Повесть о бедном чиновнике создана в период работы над «Мертвыми душами». Творческий замысел «Шинели» не сразу получил воплощение. Первый набросок относится к середине 1839 года, когда под диктовку Гоголя Погодиным было записано начало «повести о чиновнике, крадущем шинели». Углубление замысла и его осуществление шли постоянно; прерываемая другими творческими интересами, работа над повестью продолжалась вплоть до 1842 года.<\/p>"}, {"group": "", "label": "Идейное содержание", "html": "<h2>Идейное содержание<\/h2><p>Тема униженного человека. Башмачкин – главный герой повести; перед читателем разворачивается трагедия «маленького человека», показанная в ее простоте, обыденности и безыскусности. В образе Акакия Акакиевича Гоголь показал «существо никем не защищенное, никому не дорогое», олицетворяющее угнетенный и забитых людей, обреченных на нечеловеческое существование. При этом Гоголь обличает социальные пороки не в политическом плане, а как моралист. Он видит свой долг писателя в том, чтобы направить заблудившихся на стезю добродетели. Моралист, в понимании Гоголя, -это исправитель нравов. <\/p>"}, {"group": "Тема «маленького человека»", "label": "Тема «маленького человека»", "html": "<h2>Тема «маленького человека»<\/h2><p>Основная проблема повести – взаимосвязь человека и общества, поставленная еще Пушкиным. Если он рассматривал ее через действия, поступки героев, то Гоголь основным средством выбирает бытописание. Психологическая характеристика у него чаще всего призвана раскрыть человеческие недостатки и используется как сатирическое или юмористическое средство. Юмор определяет общий колорит произведения. Судьба «маленького человека» раскрывается в юмористическом повествовании (в отличие от предшествующих произведений). Сочувственный юмор Гоголя выявляет глубокий драматизм жизни, который проявляется и в образе главного героя, и в его отношениях с окружающим миром. «Акакий» - по-гречески значит «незлобивый». Повесть написана как житие святого угодника, безответного, смиренного, тихого. Гоголь не выдумал своего Башмачкина, а взял из собственных наблюдений над департаментской действительностью. В самом начале повести Гоголь иронизирует над читателем: «В департаменте… но лучше не называть, в каком департаменте». Писатель подробно объясняет, почему он не называет точного места службы Акакия Акакиевича, а говорит «один департамент». Гоголя очень волновал вопрос об отношении читателя к смеху. Эстетически неразвитый читатель не чувствует условной и обобщающей природы художественного образа. Ему кажется, что произведение всегда метит в какое-то определенное, конкретное лицо. Так же – и в «Мертвых душах»; говоря об этом, Гоголь заключал: «…а потому, для избежания всего этого, будем называть одну даму « дамой приятной во всех отношениях», а другую – «дамой просто приятной». «Итак, в одном департаменте служил один чиновник…» - далее следует портрет героя, в котором подчеркивается приниженность, забитость, убогость «маленького человека». Используются прилагательные с суффиксом неполноты признака («несколько рябоват, несколько рыжеват, несколько даже на вид подслеповат»). При этом сразу же подчеркивается обобщенность образа: «вечный титулярный советник», чин, над которым вдоволь острили разные писатели. Если Пушкин, открывая тему «маленького человека», описал чиновников 14-го (низшего) класса ( коллежскими регистраторами были Самсон Вырин, Езерский, может быть Евгений, чин которого точно не указан), то Гоголь делает своего героя чиновником 9-го класса. Гоголь подчеркивает «предопределенность» судьбы главного героя: незавидная участь выпала ему уже тогда, когда выбирали имя. «Родильнице предоставили на выбор любое из трех…Моккия, Соссия, или назвать ребенка во имя мученика Хоздазата»; так как все имена не понравились, «развернули календарь а другом месте»; вышли опять три имени:Трифилий, Дула и Варахасий». Затем появились «Павсикахий и Вахтисий». «Ну, уж я вижу, - сказала старуха, - что, видно, его такая судьба. Уж если так, пусть лучше будет он называться, как и отец его». Рассказчик иронически добавляет: «Мы привели потому это, чтобы читатель мог сам видеть, что это случилось совершенно по необходимости и другого имени дать было никак невозможно». Предрешенность судьбы Акакия Акакиевича проявилась и в том, что никто не помнил, когда он поступил на службу в департамент. Он всегда был в одной и той же должности, и потому решили, что «он, видно, так и родился на свет уже совершенно готовым, в вицмундире и с лысиной на голове». Таким образом, нет никаких фактов его биографии, никаких деталей, не связанных со службой в департаменте, для того чтобы показать: Акакий Акакиевич целиком и полностью принадлежит этой системе и его существование исчерпывается службой. Создавая образ, Гоголь (по мысли Ю.Манна) использует прием усложнения. Акакий Акакиевич – существо социально униженное, безмерно забитое. Связываемое с ним понятие «маленький человек» вовсе не надуманное. Но его забитость настолько безгранична, что не укладывается ни в какую социальную обусловленность. «Перед нами  существо, как бы самой природой отчужденное от человеческой общности, поставленное по отношению к ней по другую сторону барьера». «Предопределенность» судьбы героя постепенно выявляется в повести как суровая зависимость от общих условий жизни. Вечный титулярный советник Башмачкин занимает весьма скромное, малозаметное место в обществе. В сложной бюрократической машине ему отведена ничтожная роль. Башмачкин воспитан в духе слепого подчинения начальству, механического исполнения приказов. Он не привык размышлять над смыслом и содержанием своей работы. Труд Акакия Акакиевича лишен какой бы то ни было инициативы или творческого начала. Суть его жизни сведена к механическому переписыванию канцелярских бумаг. Многолетняя служба полностью лишила его способности самостоятельно мыслить и действовать. Все переживания, мысли и чувства Башмачкина сконцентрированы на переписывании. «Вряд ли где можно было найти человека, который так жил бы в своей должности. Мало сказать: он служил ревностно, нет, он служил с любовью. Там, в этом переписыванье, ему виделся какой-то свой разнообразный и приятный мир…». Иного мира для Башмачкина не существовало, он его не видел и не знал. И домашний уклад жизни титулярного советника - это некое подобие службы: те же занятия, но теперь уже для «собственного удовольствия»! Отношения его с окружающими столь же характерны: Башмачкин был постоянной целью всеобщих шуток и насмешек и при этом покорно сносил все и даже «не делал ни одной ошибки в письме». Если же ему мешали заниматься его делом, он говорил только: «Оставьте меня, зачем вы меня обижаете?» В его голосе было “ что-то такое преклоняющее на жалость», так что в словах его «звенели другие слова: «Я брат твой»”. В патетичном описании молодого человека, который , недавно поступив на службу, впервые столкнулся с такой сценой, звучит, по мнению Гуковского, «не столько гнев, проклятье, сколько просьба о милости». В научной литературе встречаются два разных истолкования смысла этого отрывка. Эйхенбаум, например, видит в нем несомненную авторскую иронию. Итак, Акакий Акакиевич только переписывал. «Один директор, будучи добрый человек», приказал дать ему дело поважнее, но это оказалось решительно не под силу Башмачкину: “Это задало ему такую работу, что он вспотел совершенно, тер лоб и наконец сказал: «Нет, лучше дайте я перепишу что-нибудь»”. Зато в переписывании герой находил своеобразную поэзию: у него были буквы- фавориты, переписывая которые, он «и  подсмеивался, и подмигивал, и помогал губами». Этот эпизод построен на контрасте: с одной стороны, выявляется полная неспособность мыслить, ограниченность до предела. С другой – вдохновенное переписывание свидетельствует о нераскрывшихся возможностях Акакия Акакиевича. Башмачкин абсолютно лишен какой бы то ни было защиты. Среди сослуживцев он встречает либо холодное равнодушие, либо оскорбительные насмешки. Гоголь показывает с помощью самых разных приемов: примитивность Акакия Акакиевича сформирована его образом жизни, средой; все это предопределено заранее. Он впитал в себя дух окружающей его социальной среды и не видит ничего ненормального ни в своем существовании, ни в отношении к нему сослуживцев и начальства. Он считает условия своей жизни естественными и не желает лучших. Башмачкин безропотно воспринимает все оскорбления и унижения. Показательно, что лишь после встречи со «значительным лицом», в состоянии беспамятства он проявляет «буйство» (тут уместно вспомнить «Медный всадник», бунт безумного чиновника).<\/p>"}, {"group": "Тема «маленького человека»", "label": "Рассказывая о приниженности Башмачкина, Гоголь не…", "html": "<p> Рассказывая о приниженности Башмачкина, Гоголь не рисует «ужасных» картин , то есть чего-то необычного; наоборот, он описывает быт, повседневную жизнь героя, в которой и раскрываются трагические начала. И в результате обыденные мелочи, бытовые детали приобретают обобщающее значение. С особой силой подчеркнута незыблемость, постоянство приниженности Акакия Акакиевича: «Ни один раз в жизни не обратил он внимания на то, что делается … на улице»; «даже в те часы, когда совершенно потухает петербургское серое небо … даже в то время, когда все чиновники рассеиваются по маленьким квартиркам своих приятелей поиграть в штурмовой вист … словом, даже тогда, когда все стремится развлечься, - Акакий Акакиевич не предавался никакому развлечению». Убогость интересов, степень приниженности героя привели к стиранию индивидуальных качеств, превращению Акакия Акакиевича в серое, жалкое, безликое существо. Описание костюма и внешнего вида героя – важные средства создания образа «маленького человека». По наблюдению Андрея Белого, Гоголь использует «неопределенно-сложные неяркие краски», сравнивает цвет предметов не с цветами спектра, а с предметами; так, у Башмачкина был мундир «зелено-мучнистого цвета».<\/p>"}, {"group": "Тема «маленького человека»", "label": "Итак, Акакий Акакиевич был безразличен ко…", "html": "<p> Итак, Акакий Акакиевич был безразличен ко всему, кроме переписыванья; даже дома переписывал для собственного удовольствия, никогда нигде не бывал и ложился  спать с мыслью: «Что-то Бог пошлет переписывать завтра». Парадокс гоголевского творчества - в совмещении несовместимого, «высокого» и «низкого». В «Шинели» высокая романтическая страсть низводится до простой, будничной, материальной почвы – и при этом сохраняет свою высоту и значительность. Центральный персонаж строится на переосмыслении романтического материала – может быть, единственном в истории литературы. Ничем не нарушаемая внутренняя сосредоточенность на чем-то одном – это отличительная черта романтических героев. У Акакия Акакиевича страсть к переписыванию проникла в глубь души. Там протекала какая-то таинственная и богатая жизнь духа, о которой догадаться можно было по странным отблескам на его лице (описание того, как выводил Башмачкин буквы-фавориты). И когда он не справляется с заданием чуть посложнее, в этом проявляется не только его умственная неразвитость; это еще и некая верность долгу, маниакальная сосредоточенность на любимой идее. И даже когда все вокруг предавалось наслаждениям – Акакий Акакиевич и тогда оставался невозмутим. Как пишет Манн, даже перед лицом шквала соблазнов и раздражителей адского города Башмачкин умел сохранить голубиное спокойствие сосредоточенного на своем деле подвижника. <\/p>"}, {"group": "Тема «маленького человека»", "label": "Сюжет строится на переходе от сосредоточенности…", "html": "<p>Сюжет строится на переходе от сосредоточенности на переписывании к концентрации на более конкретной теме. Шинель становится целью всего; Акакий Акакиевич отказывает себе во всем, экономя деньги, - «зато он питался духовно, нося в мыслях своих вечную идею будущей шинели». Суть гоголевского преобразования романтической традиции в том, что заботы материальные (переписывание бумаг и шинель) переживаются главным героем как цели духовные. Это же проявляется на уровне стиля повести. Эйхенбаум писал, что стилистический поток «Шинели» можно разделить на два слоя: «чистый комический сказ … соединен с патетической декламацией». Соединение несоединимого рождает сильнейший эффект. Акакий Акакиевич оказывается страшным образом! В этом изуродованном, больном существе оказывается скрыта могучая внутренняя сила. Но как «низка» та цель, к которой она обращена! Однако цель эта – новая шинель - жизненно необходима в бедном, скудном, убогом существовании «маленького человека». <\/p>"}, {"group": "Тема «маленького человека»", "label": "Ярким средством создания образа Башмачкина становится…", "html": "<p>Ярким средством создания образа Башмачкина становится и его речь. Для того, чтобы создать впечатление о Башмачкине как о существе робком, жалком, забитом, не умеющем даже выразить собственную мысль, Гоголь прибегает к особому художественному приему – характеристике персонажа с помощью так называемой 6 косноязычной речи. Акакий Акакиевич «изъяснялся большей частью предлогами, наречиями и, наконец, такими частицами, которые решительно не имеют никакого значения»; «даже имел обыкновение совсем не оканчивать фразы…». Вот как говорил Башмачкин: «Так этак-то! Вот какое уж, точно, никак неожиданное, того… этого бы никак… этакое-то обстоятельство!» Мечта о новой шинели неузнаваемо изменила жизнь Акакия Акакиевича: она одухотворяется целью! Гоголь приводит трагикомические подробности, как экономил Башмачкин («избегать употребление чаю по вечерам», «не зажигать по вечерам свечи», ступать по улице осторожно, чтобы продлить жизнь подметок). В этом проявляется природа комического – контраст низкого и высокого: за комической ситуацией встает общественная трагедия «маленького человека», который с рождения обречен. Гоголь дает описание «другого» Акакия Акакиевича: лицо «такое значительное, как никогда прежде»; он пришел в «самое праздничное расположение чувств», он стал личностью. Итак, духовное вырождение Башмачкина Гоголь изображает не как исключение. Источник страшного измельчания личности заключен в социальной униженности «маленького человека». Образ Акакия Акакиевича – художественное обобщение огромного диапазона.<\/p>"}, {"group": "", "label": "Система персонажей", "html": "<p> Делая Башмачкина центральным героем повести, Гоголь включает в <strong>систему персонажей<\/strong> еще всего два рельефно очерченных характера – это Петрович и «значительное лицо». В этом лаконизме и проявилось высочайшее художественное мастерство Гоголя. Два образа воссоздают социальное «окружение» Башмачкина. И в самом выборе этих фигур отчетливо выявляется их внутреннее противопоставление друг другу. <strong>Портной Петрович<\/strong> – единственный, кто принимает живое участие в Башмачкине. Ему понятны тревоги и волнения Акакия Акакиевича. И это возможно потому, что Петрович и сам принадлежит к разряду «маленьких» людей: «Сначала он назывался просто Григорий и был крепостным человеком у какого-то барина; Петровичем он начал называться с тех пор, как получил отпускную и стал попивать довольно сильно по всяким праздникам». В изображении Петровича – тот же сочувственный юмор, что и в характеристике Башмачкина. Жизнь приносит портному так же мало радостей, как и Акакию Акакиевичу. Петрович ютится «где-то в четвертом этаже на черной лестнице», добывает средства тем, что обслуживает людей, которые находятся в бедственном  положении. За суровым и малосимпатичным внешним обликом скрывается отзывчивая душа простого человека. Он разделяет с Башмачкиным его тревожное ожидание, а затем и долгожданную радость.<\/p>"}, {"group": "", "label": "«Значительное лицо»", "html": "<p> В отличие от Башмачкина и Петровича, <strong>«значительное лицо»<\/strong> изображен сатирически. Сцена с этим героем – кульминация повести; эпизод показывает закономерность и неизбежность унижений «маленького человека». Неслучайно персонаж лишен имени: это обобщенный образ бюрократической власти (сравните с «Медным всадником»!). «Значительное лицо» - раб своего чина: человек добрый, но «генеральский чин совершенно сбил его с толку»; он не разговаривает с «низшими», боясь уронить свое достоинство. При этом Гоголь подчеркивает, что личные качества не играют тут никакой роли: «он был в душе добрый человек, хорошо с товарищами, услужлив… но как только случалось ему быть в обществе, где были люди хоть одним чином пониже его, там он был просто хоть из рук вон». «Обыкновенный разговор его с низшими отзывался строгостью и состоял почти из трех фраз: «Как вы смеете? Знаете ли вы, с кем говорите? Понимаете ли, кто стоит перед вами?». Сцены со «значительным лицом» расширяют и обобщают то воздействие общественного уклада, которое предопределило всю жизнь Акакия Акакиевича и привело его к гибели. В одной из редакций «Шинели» есть следующие строки: «А мы, однако ж, оставили совершенно без внимания главную причину всего несчастья, именно значительное лицо». Это место в окончательной редакции было изменено, смягчено – возможно, с учетом цензурных требований. Встреча Башмачкина со «значительным лицом» показана как столкновение не с дурным человеком, а с «обычным» порядком, то есть Башмачкин страдает не от бесчеловечности отдельного лица, а от собственного бесправия. В этом проявляется <strong>гуманизм<\/strong> Гоголя, который отстаивает права бесправных. Рассказ об обыденном сливается с описанием «чрезвычайных» происшествий – похищения шинели, встречи со «значительным лицом». Каждое из этих событий составляет как бы высшую точку отдельных частей повествования. Развитие сюжета идет от смиренного прозябания героя к сценам столкновения его с «власть имущими». Напряженность и драматизм этих столкновений делает органичной <strong>фантастику,<\/strong> введенную в финал повести. Фантастический элемент не имеет иррационального характера; он необходим для раскрытия основной идеи. Только смерть кладет конец  покорности и смирению. В бреду, перед смертью, Акакий Акакиевич “сквернохульничал, произнося самые страшные слова», которые следовали непосредственно за словом «ваше превосходительство» “. Так защищается человек в «маленьком человеке». Примечательно, что в первом варианте «Шинели» герой был доволен своим положением. В окончательной редакции у Башмачкина снята оценка собственного бытия. Он полностью подчинен порядку, и оттого пробуждение человеческого в нем особенно заметно.<\/p>"}, {"group": "", "label": "Форма сказа", "html": "<p> В «Шинели» Гоголь прибегает к приему повествования от имени рассказчика. Вообще <strong>форма сказа<\/strong> в русской литературе - от Гоголя («Вечера на хуторе близ Диканьки»). Суть этой формы, или манеры, в том, что повествование ведется не от лица нейтрального, а от лица рассказчика, который заметно отличается и от автора, и от предполагаемого читателя (вспомните «Левшу» Лескова). В «Шинели” рассказчик не выдвинут на первый план, но в то же время этот образ ясно ощущается в повести. Например, «где именно жил пригласивший чиновник, к сожалению, не можем сказать: память начинает нам сильно изменять…». Сохраняя черты некоторого внешнего простодушия, рассказчик в «Шинели» далек от «непосредственности» Рудого Панька. Образ рассказчика несет сочувствие незнатному, простому человеку. В отдельных эпизодах Гоголь непосредственно высказывает свое отношение к герою. Это создает лирико-патетическое начало повести, проявляющееся в словах о жестоком «бесчеловечье», в размышлениях в связи со смертью Акакия Акакиевича («Исчезло и скрылось существо, никем не защищенное, никому не дорогое, ни для кого не интересное…»). Создавая «Шинель», Гоголь стремился выпукло показать мир униженного героя, а также охарактеризовать отношения «маленького человека» со средой. Последовательно осуществляя эти творческие задачи, «писатель добивается поразительной концентрированности словесного выражения, необычайной меткости художественного слова» (пишет исследователь Храпченко).<\/p>"}, {"group": "", "label": "Метафоры", "html": "<p> Особенностью стиля стали богатство и меткость <strong>метафоры.<\/strong> Например, описание старой шинели Акакия Акакиевича. Метафора часто подводит итог целому повествовательному эпизоду (старая шинель – капот). Прием внутренних сопоставлений – это организующее начало и в построении предложения, и в отборе лексики («Если бы соразмерно его рвению давали ему награды, он, к изумлению своему, может быть, даже попал бы в статские советники…»). Внутренние сопоставления основываются на столкновении воображаемого и действительного, возвышенного и прозаического: «Огонь порою показывался в глазах его, в голове даже мелькали самые дерзкие и отважные мысли: не положить ли точно куницу  на воротник». Или: «Благодаря великодушному вспомоществованию петербургского климата, болезнь пошла быстрее…». Использование внутренних сопоставлений в структуре предложений или группы предложений нередко сочетается с обыгрыванием ударного слова: «Акакий Акакиевич если и глядел на что, то видел на всем свои чистые, ровным почерком выписанные строки, и только разве если, неизвестно откуда взявшись, лошадиная морда помещалась ему на плечо и напускала ноздрями целый ветер в щеку, тогда только замечал он, что он не на середине строки, а скорее на середине улицы». «Игру слов» Гоголь использует для характеристики героев. Так, он раскрывает различные смысловые оттенки слов «значительное» и «лицо»: «Нужно знать, что одно значительное лицо недавно сделался значительным лицом, а до того времени он был незначительным лицом». Гоголь мастерски соединяет взаимоисключающие понятия: «В полиции сделано было распоряжение поймать мертвеца … живого или мертвого …».<\/p>"}, {"group": "", "label": "Пушкинская традиция в «Шинели»", "html": "<h2>Пушкинская традиция в «Шинели»<\/h2><p>Акакий Акакиевич – гораздо более забитое и безответное существо, чем «маленькие люди» Пушкина, Самсон Вырин из «Станционного смотрителя» и Евгений из «Медного всадника». У Пушкина драматизм судеб этих героев обусловлен их примитивным существованием. Забитость «маленького человека» пронзительно проявляется в элементарности его желаний – служить, добывая нищенские средства к существованию, иметь семью. Пушкинская коллизия подсказала судьбу Башмачкина: его глухую, бессмысленную жизнь преображает цель. Следуя за Пушкиным, Гоголь ужесточил и саму цель героя (там- семейное счастье, дом, дети; тут – «сооружение» новой шинели), и неминуемую катастрофу. Теперь униженье достигло предела, забитый государственным режимом человек утрачивал достоинство и индивидуальность, и если у него и появлялась мечта – то он мечтал о приобретении жизненно необходимой вещи. Пушкинское начало проявилось и в том, что появление цели поднимало человека на иной уровень существования. Гоголь показал. Как просыпалась личность Башмачкина, как обнаружились в этом бессловесно-покорном существе даже смелость и дерзость. Он подумывал, например, не положить ли куницу на воротник. Дерзость – в том, что Акакий Акакиевич посчитал себя вправе иметь на шинели такой же воротник, какой положен на генеральских шинелях. Несомненно пушкинское влияние и в финале повести. <\/p>"}, {"group": "Смысл финала", "label": "Смысл финала", "html": "<h2>Смысл финала<\/h2><p> Финал повести «Шинель» послужил поводом для многочисленных споров, получил самые разные истолкования (от бунта, протеста, возмездия – до перелома в сознании Гоголя, приведшего к созданию «Выбранных мест из переписки с друзьями»). Особенность повести в том, что финальный фантастический эпизод внешне никак не подготовлен предшествующим рассказом, который выдержан в чисто бытовом плане. В действительности фантастика играет в повести особую роль и все произведение построено в расчете на заключительный эпизод. Описывая появление в Петербурге призрака в виде чиновника, повествователь подчеркивает, что множатся слухи, обрастая подробностями. В этих описаниях очевидна гоголевская ирония. Именно слухи сотворили миф о мертвеце-мстителе. Описания строятся на алогизмах: один из департаментских чиновников «узнал» Акакия Акакиевича, но это внушило ему такой страх, что он бросился бежать и оттого не мог хорошенько рассмотреть. Со всех сторон стали поступать жалобы о разбое «мертвеца». Начальство распорядилось поймать его. Алогизм приказа раскрывает абсурдность поведения властей. И, как лукаво заявляет повествователь, указание было выполнено: будочник с товарищами поймали «живого мертвеца» - еще один алогизм. Призрак, созданный слухами, на этот раз оказался живым грабителем (дано натуралистическое описание поимки). Любопытное прочтение финала находим у Набокова. В призраке он видит реального грабителя, который отобрал шинель у Акакия Акакиевича (огромный кулак и усы). Набоков пишет: «Гоголевская «Шинель» - рваная рана, черная дыра в тусклой ткани повседневности». Башмачкин трогателен и трагичен. Он представляет собой в этом нелепейшем мире и современную сущность его, и вместе с тем патетическую попытку преодоления абсурда.<\/p>"}, {"group": "Смысл финала", "label": "Со смыслом финала связан выбор имени…", "html": "<p> Со смыслом финала связан <strong>выбор имени<\/strong> главного героя. Как известно, в то время имена давались в честь святых, легендарные подвиги и добродетельная жизнь которых описывались в житиях. Эти жития входили в книги Четьи-Минеи, которые читались в церквях; жития в них были расположены по числам и месяцам. Жития святых определяли содержательность имени, которое давалось новорожденному. Подробное описание выбора имени Башмачкину в начале повести кажется лишним, но лишь на 11 первый взгляд. Имя «Акакий» значит «незлобивый». В Четьях-Минеях (то есть многотомном своде житий святых) было несколько житий, посвященных разным святым с этим именем. Особой популярностью пользовался <strong>Акакий Синайский<\/strong>. В его житии рассказано, как у злого старца был молодой учение по имени Акакий. Старец всякий день мучил ученика укорами и даже истязал физически. Так и жил Акакий – терпеливо сносил все и на вопрос: «Как живешь?» - неизменно отвечал: «Мне хорошо». Своей безропотностью и незлобивостью он снискал благодать Божию. Просвечивающая в имени гоголевского героя житийная символика в ходе повествования наполняется реальным содержанием. Именно житийная символика предопределила мученическую судьбу забитого титулярного советника. Исследователь Фридлендер писал: «Пользуясь позднейшим выражением Лескова, можно сказать, что жизнь Акакия Акакиевича – это не обычная «жизнь», а «житие». Акакий Акакиевич не только в буквальном смысле, как Самсон Вырин, но и в фигуральном – «мученик 14-го класса», - недаром посмертная молва окружила его земное бытие легендарными подробностями. Как в легендах о других «мучениках», тяжелые испытания и смерть в «житии» Акакия Акакиевича составляют вступление к последней главе его похождений, повествующей о «воскресении» героя и подвигах, совершенных им после смерти». Гоголь пишет, что несчастие погубило Башмачкина так же, как оно губит царей и повелителей мира. Виновники несчастий – сами люди. Значит, надо нравственно воскресить тех, кто в реальной жизни становится причиной страданий беззащитных существ. Фантастический финал – рассказ о том, как удалось Акакию Акакиевичу «на несколько дней прожить шумно после своей смерти». Эта фраза, по мнению исследователя Макагоненко, - явный намек на житие Акакия Синайского. Финал жития этого святого таков. После недолгой болезни многострадальный Акакий умер. Но нашлись те, кто не поверил его смерти. И тогда старец. Мучивший его при жизни, пошел на могилу и спросил: «Умер ли ты?» И ответил Акакий: «Не умер, отче, ибо тому, кто обязался творить послушание, невозможно умереть» (церковнославянский текст еще выразительнее: « Не умрех, отче, послушания бо делателю умрети не возможно»). За послушание Акакию даровано бессмертие. Старец здесь же, на могиле, покаялся во грехах своих. <\/p>"}, {"group": "Смысл финала", "label": "«Шумная» жизнь Башмачкина после смерти и…", "html": "<p> «Шумная» жизнь Башмачкина после смерти и нужна Гоголю, чтобы показать, что узнавший его «значительное лицо» осознал свою вину. Одна из целей житий святых – утверждение нравственного кодекса праведников. И в житии Акакия Синайского не только превозносились терпение и послушание, но и утверждалась мысль, что эта добродетель будет вознаграждена, что она активна и обладает всепоглощающей силой. Именно это и привлекло Гоголя в житии Акакия Синайского. Гоголь не переделал текст жития, он написал глубоко оригинальное произведение. Но свою веру в возможность нравственного воскрешения даже высокопоставленных чиновников он подтверждал авторитетным старинным и хорошо известным широким массам житием. В.Шкловский, анализировавший «Шинель», также соотносил жизнь Акакия Акакиевича с житием Акакия Синайского: «Акакий Акакиевич – человек великого смирения; этим святой Акакий выделяется среди многих святых».<\/p>"}, {"group": "Смысл финала", "label": "«Значительное лицо» не случайно занимает столь…", "html": "<p> «Значительное лицо» не случайно занимает столь важное место в повести. В нем сконцентрировано все зло социальной действительности. При этом утверждается, что и сам «значительное лицо» - жертва бюрократического строя. Гоголь видит в генерале душу и уснувшую совесть. После ухода Башмачкина генерал «почувствовал что-то вроде сожаления. Сострадание было ему не чуждо, его сердцу были доступны многие добрые движения, несмотря на то, что чин весьма часто мешал им обнаруживаться». Известие о смерти Башмачкина поразило генерала: «Он слышал упреки совести». В финале произойдет нравственное освобождение чиновника. Этим финал «Шинели» перекликается с финалом «Ревизора». Удар по чиновникам «сборного города» нанес чиновник, прибывший по именному повелению, а точнее, само только известие о его приезде. Чиновники застыли в «немой сцене», которая, по замыслу Гоголя, станет рубежом в их жизни: позади грехи и преступления, впереди – новая, преображенная жизнь. Но в «Ревизоре» нет результата преображения, есть лишь показ его возможности. Этот замысел Гоголя не был понят, и в финале «Шинели» писатель вновь показывает свой идеал. Но теперь он отказывается от идеи справедливой власти как источника возмездия и, следовательно, преображения (как это было в «Ревизоре»). Теперь ударом становится встреча с призраком. Фантастика создает возможность узнавания в приведении Акакия Акакиевича. При этом Башмачкин нигде напрямую не отождествляется с призраком, который сдергивал шинели с чиновников разных рангов и не вступал с ними в разговоры. Чиновник же, ухвативший за  воротник «значительное лицо», напоминает ему о его поступке, но не мстит ему, то есть не сдергивает с него шинель, - «значительное лицо» сам снимает свою шубу и бросает ее призраку. Ю.Манн первым обратил внимание на стилистическое своеобразие этого эпизода: тут опущен глагол, обозначающий «слушание»; «значительное лицо» «увидел» реплику мертвеца. Призрак – плод больной совести генерал и осознанной им вины перед несчастным, которому не помогли. При этом глагол «увидел» вместо «услышал» решительно отделяет призрак Башмачкина от реального грабителя (трактовка Набокова). Но Гоголь уточняет: появления чиновника-мертвеца после этого прекратились, впрочем, многие люди никак не хотели успокоиться. «Один коломенский будочник» видел призрак и пошел за ним. Но «привидение вдруг оглянулось и остановясь спросило: «Тебе чего хочется?» и показало такой кулак, какого и у живых не найдешь!.. Привидение, однако ж, было уже гораздо выше ростом, носило преогромные усы…». Так исчерпал Гоголь сюжет с мертвецами-грабителями. Башмачкин не имеет к ним никакого отношения. Призрак, в котором «значительное лицо» признал Башмачкина, не сдергивал шинель, не был огромного роста, не имел усов и огромных кулаков, ничего не говорил - его речи не было слышно… Но грабитель, снявший шинель с Акакия Акакиевича, имел громадный кулак и усы, как у призрака, похождениями которого и заканчивается «Шинель». Таким образом, смысл финала повести – вера Гоголя в реальность просветительского перевоспитания погрязших в пороках людей. Тем самым финал «шинели» проясняет замысел «Ревизора», а с другой стороны, объясняет громадный замысел «Мертвых душ», который предусматривал в последующих томах показ возрождения порочных героев первого тома поэмы. Идея протеста, насильственных изменений социального строя была органически чужда Гоголю, так как он опирался на просветительскую концепцию изменения мира. В этом – принципиальное расхождение Гоголя и Пушкина, которые показывал закономерность и благодетельность протеста и бунта, хотя никогда не проповедовал революцию. <\/p>"}]};
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON={
 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',
 r:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',
 grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>'
};
/* theme */
(function(){const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t;
 $('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#151618';
  const n=dark?'light':'dark';document.documentElement.dataset.theme=n;store.set('theme',n)};})();
$('#menuBtn').onclick=()=>$('#app').classList.toggle('sbopen');
const prog=p=>$('#prog').style.width=(p*100)+'%';

/* ---------- slides ---------- */
if(MODE==='slides'){
  const P=D.pages; let cur=Math.min(store.get('pos',0),P.length-1); let seen=new Set(store.get('seen',[]));
  const side=$('#side'); let h=''; let lastG=null;
  const gcount={}; P.forEach(p=>{if(p.group)gcount[p.group]=(gcount[p.group]||0)+1});
  P.forEach((p,i)=>{
    const multi=p.group&&gcount[p.group]>1;
    if(p.group!==lastG&&p.group&&(multi||/^\d$/.test(p.group))){
      if(!(multi&&p.label===p.group)) h+=`<div class="grp${/^\d$/.test(p.group)?' num':''}">${esc(p.group)}</div>`;
    }
    lastG=p.group;
    const sub=multi&&p.label!==p.group;
    h+=`<a data-i="${i}" class="${sub?'sub':''}"><span class="n">${i+1}</span><span>${esc(p.label)}</span></a>`;
  });
  side.innerHTML=h;
  side.onclick=e=>{const a=e.target.closest('a');if(a){go(+a.dataset.i);$('#app').classList.remove('sbopen')}};
  function go(i){
    if(i<0||i>=P.length)return; cur=i; seen.add(i); store.set('pos',i); store.set('seen',[...seen]);
    const head=(i===0&&D.heading)?`${D.kicker?`<div class="kicker">${esc(D.kicker)}</div>`:''}<h1 class="doc-h">${esc(D.heading)}</h1>`:'';
    $('#stage').innerHTML=`<article class="card slide">${head}<div class="prose">${P[i].html}</div></article>`;
    $('#main').insertAdjacentHTML('beforeend','');
    pager.querySelector('.cnt').textContent=`${i+1} / ${P.length}`;
    pager.querySelector('.prev').disabled=i===0; pager.querySelector('.next').disabled=i===P.length-1;
    side.querySelectorAll('a').forEach(a=>{const k=+a.dataset.i;a.classList.toggle('on',k===i);a.classList.toggle('seen',seen.has(k)&&k!==i)});
    const on=side.querySelector('a.on'); if(on)on.scrollIntoView({block:'nearest'});
    $('#main').scrollTo({top:0,behavior:'instant'}); prog((i+1)/P.length);
  }
  const pager=document.createElement('div'); pager.className='pager';
  pager.innerHTML=`<div class="bar"><button class="prev" aria-label="←">${ICON.l}</button><span class="cnt"></span><button class="next" aria-label="→">${ICON.r}</button></div>`;
  $('#main').appendChild(pager);
  pager.querySelector('.prev').onclick=()=>go(cur-1); pager.querySelector('.next').onclick=()=>go(cur+1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  go(cur);
}

/* ---------- terms ---------- */
if(MODE==='terms'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let on=new Set(store.get('on',[]));
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <p class="lead">${D.intro}</p>
   <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="val" id="val"></div></div>
   <ul class="terms">${D.terms.map((t,i)=>`<li><button class="term" data-i="${i}"><span class="box">${ICON.chk}</span><span>${esc(t)}</span></button></li>`).join('')}</ul>
   <div class="callout">${D.outro}</div></article>`;
  function upd(){document.querySelectorAll('.term').forEach(b=>b.classList.toggle('on',on.has(+b.dataset.i)));
    const p=on.size/D.terms.length;$('#fill').style.width=p*100+'%';$('#val').textContent=`${on.size} / ${D.terms.length}`;prog(p);store.set('on',[...on])}
  document.querySelectorAll('.term').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);upd()});
  upd();
}

/* ---------- essay ---------- */
if(MODE==='essay'){
  $('#app').classList.add('nosb'); $('#side').remove();
  const drafts=store.get('drafts',{});
  $('#stage').innerHTML=`<article class="card slide"><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="callout" style="margin-bottom:28px">${D.intro}</div>
   ${D.questions.map((q,i)=>`<div class="q" data-i="${i}"><button class="q-head">${D.numbered?`<span class="no">${i+1}</span>`:''}<span class="tx">${q}</span><span class="dot"></span><span class="chev">${ICON.chev}</span></button>
     <div class="q-body"><textarea spellcheck="true" aria-label="${i+1}"></textarea></div></div>`).join('')}</article>`;
  function upd(){let n=0;document.querySelectorAll('.q').forEach(q=>{const has=!!(drafts[q.dataset.i]||'').trim();q.classList.toggle('has',has);if(has)n++});prog(n/D.questions.length)}
  document.querySelectorAll('.q').forEach(q=>{const i=q.dataset.i,ta=q.querySelector('textarea');ta.value=drafts[i]||'';
    q.querySelector('.q-head').onclick=()=>{q.classList.toggle('open');if(q.classList.contains('open'))ta.focus()};
    ta.oninput=()=>{drafts[i]=ta.value;store.set('drafts',drafts);upd()}});
  upd();
}

/* ---------- glossary ---------- */
if(MODE==='glossary'){
  $('#app').classList.add('nosb'); $('#side').remove();
  let view=store.get('view','list'), letter=null, q='', flipped=new Set();
  const letters=[...new Set(D.entries.map(e=>e[0][0].toLowerCase()))];
  $('#stage').innerHTML=`<article class="card slide"><div class="kicker">${esc(D.kicker)}</div><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="gl-tools"><label class="search">${ICON.search}<input id="q" type="search" autocomplete="off"></label>
   <div class="seg"><button data-v="list" aria-label="≡">${ICON.list}</button><button data-v="cards" aria-label="▦">${ICON.grid}</button></div></div>
   <div class="abc">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
   <div id="out"></div></article>`;
  function draw(){
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
    document.querySelectorAll('.abc button').forEach(b=>b.classList.toggle('on',b.dataset.l===letter));
    const ql=q.trim().toLowerCase();
    const list=D.entries.map((e,i)=>[e,i]).filter(([e])=>(!letter||e[0][0].toLowerCase()===letter)&&(!ql||(e[0]+' '+e[1]).toLowerCase().includes(ql)));
    const out=$('#out');
    if(!list.length){out.innerHTML='<div class="empty">—</div>';return}
    if(view==='list') out.innerHTML=`<ul class="gl-list">${list.map(([e])=>`<li><div class="t">${esc(e[0])}</div><div class="d">${esc(e[1])}</div></li>`).join('')}</ul>`;
    else{out.innerHTML=`<div class="gl-cards">${list.map(([e,i])=>`<button class="flip${flipped.has(i)?' on':''}" data-i="${i}"><div class="in"><div class="f">${esc(e[0])}</div><div class="b">${esc(e[1])}</div></div></button>`).join('')}</div>`;
      out.querySelectorAll('.flip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;flipped.has(i)?flipped.delete(i):flipped.add(i);c.classList.toggle('on');prog(flipped.size/D.entries.length)})}
  }
  $('#q').oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);draw()});
  document.querySelectorAll('.abc button').forEach(b=>b.onclick=()=>{letter=letter===b.dataset.l?null:b.dataset.l;draw()});
  draw(); prog(0);
}
</script>
</body>
</html>
