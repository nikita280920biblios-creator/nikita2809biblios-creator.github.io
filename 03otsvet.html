<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ю. МАНН. КОМЕДИЯ ХАРАКТЕРОВ С ГРОТЕСКНЫМ «ОТСВЕТОМ»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6d6b66; --line:#e3e1db;
  --accent:#2f4b7c; --accent-soft:#e8edf6; --mark:#fbf1c7; --ok:#2e7d5b; --ok-soft:#e3f2ea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  --sans:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#151618; --panel:#1e2023; --ink:#e9e7e2; --muted:#9a978f; --line:#2e3135;
  --accent:#8fb0e8; --accent-soft:#232c3c; --mark:#3a3420; --ok:#6fcf9f; --ok-soft:#1d3329;
  --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.app.nosb{grid-template-columns:1fr}
/* top bar */
.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line);position:relative}
.top .crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sep{width:1px;height:20px;background:var(--line)}
.top .sp{flex:1}
.progress{position:absolute;left:0;bottom:-1px;height:3px;background:var(--accent);width:0;transition:width .35s ease}
.icon-btn{width:36px;height:36px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--accent)}
.icon-btn svg{width:20px;height:20px}
#menuBtn{display:none}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 10px 30px}
.side .grp{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px}
.side .grp.num{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--accent)}
.side a{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35;cursor:pointer}
.side a .n{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--muted);margin-top:-1px}
.side a.sub{padding-left:26px;font-size:13.5px;color:var(--muted)}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side a.on .n{border-color:var(--accent);background:var(--accent);color:var(--panel)}
.side a.seen .n{border-color:var(--accent);color:var(--accent)}
/* main */
.main{overflow:auto;position:relative;scroll-behavior:smooth}
.stage{max-width:820px;margin:0 auto;padding:40px 32px 120px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:48px 56px}
.slide{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;line-height:1.5}
.doc-h{font-family:var(--serif);font-size:30px;line-height:1.2;margin:0 0 28px;font-weight:700}
.prose{font-family:var(--serif);font-size:19px;line-height:1.72}
.prose p{margin:0 0 1.05em;text-indent:1.4em;hyphens:auto}
.prose h2{font-family:var(--sans);font-size:22px;font-weight:600;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid var(--accent);display:inline-block}
.prose h2+p,.prose .part-no+p,.prose p:first-child{text-indent:0}
.prose strong{font-weight:700;background:linear-gradient(transparent 62%,var(--mark) 62%);padding:0 1px}
.prose em{font-style:italic}
.prose sup.ref{font-family:var(--sans);font-size:.6em;color:var(--muted);vertical-align:super;line-height:0}
.part-no{font-family:var(--serif);font-size:56px;line-height:1;color:var(--accent);margin:0 0 20px;font-weight:700}
.part-no::after{content:"";display:block;width:40px;height:2px;background:var(--accent);margin-top:14px}
/* cover */
.cover{display:grid;grid-template-columns:220px 1fr;gap:36px;align-items:center;margin-bottom:34px;padding-bottom:30px;border-bottom:1px solid var(--line)}
.cover figure{margin:0}
.cover img{width:100%;border-radius:10px;display:block}
.cover figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.45;color:var(--muted);margin-top:10px;text-indent:0}
.cover figcaption strong{background:none;font-weight:600;color:var(--ink)}
.cover .big{font-family:var(--serif);font-size:20px;letter-spacing:.3em;margin:0 0 22px;color:var(--muted);font-weight:400}
.cover .eyebrow{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.cover .work{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1.1}
/* pager */
.pager{position:sticky;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 0 18px;margin-top:-80px}
.pager .bar{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.pager .cnt{font-size:13px;color:var(--muted);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.pager button{width:42px;height:42px;border-radius:50%;border:0;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.pager button.next{background:var(--accent);color:var(--panel)}
.pager button:disabled{opacity:.3;cursor:default}
.pager svg{width:20px;height:20px}
/* terms */
.lead{font-family:var(--serif);font-size:19px;line-height:1.65;margin:0 0 26px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:0 0 30px;padding:0;list-style:none}
.term{display:flex;align-items:center;gap:12px;padding:16px 16px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--panel);font-family:var(--serif);font-size:17.5px;font-weight:700;transition:.2s;user-select:none;text-align:left;width:100%}
.term:hover{border-color:var(--accent)}
.term .box{flex:0 0 24px;height:24px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;transition:.2s}
.term .box svg{width:15px;height:15px;opacity:0;color:#fff}
.term.on{border-color:var(--ok);background:var(--ok-soft)}
.term.on .box{background:var(--ok);border-color:var(--ok)}
.term.on .box svg{opacity:1}
.meter{display:flex;align-items:center;gap:14px;margin:0 0 22px}
.meter .track{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.meter .fill{height:100%;background:var(--ok);width:0;transition:width .3s}
.meter .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:18px 22px;border-radius:0 12px 12px 0;font-family:var(--serif);font-size:18px;line-height:1.6}
.callout strong{color:var(--accent)}
/* essay */
.q{border:1px solid var(--line);border-radius:14px;margin:0 0 12px;background:var(--panel);overflow:hidden}
.q-head{display:flex;gap:16px;align-items:flex-start;padding:18px 20px;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.q-head .no{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:14px}
.q-head .tx{flex:1;font-family:var(--serif);font-size:18px;line-height:1.5;padding-top:4px}
.q-head .chev{flex:0 0 20px;margin-top:8px;color:var(--muted);transition:transform .25s}
.q.open .chev{transform:rotate(180deg)}
.q-body{display:none;padding:0 20px 20px 70px}
.q.open .q-body{display:block}
.q textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:14px;font-family:var(--serif);font-size:17px;line-height:1.6;background:var(--bg);color:var(--ink);resize:vertical}
.q textarea:focus{outline:2px solid var(--accent);border-color:transparent}
.q .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-top:13px;flex:0 0 8px;opacity:0}
.q.has .dot{opacity:1}
/* glossary */
.gl-tools{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;height:42px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;width:44px;height:42px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--panel)}
.seg svg{width:19px;height:19px}
.abc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 24px}
.abc button{min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--serif);font-size:16px;text-transform:uppercase}
.abc button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.gl-list{list-style:none;margin:0;padding:0}
.gl-list li{display:grid;grid-template-columns:220px 1fr;gap:20px;padding:15px 0;border-top:1px solid var(--line)}
.gl-list li:first-child{border-top:0}
.gl-list .t{font-family:var(--serif);font-weight:700;font-size:18px}
.gl-list .d{font-family:var(--serif);font-size:17.5px;line-height:1.55}
.gl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.flip{perspective:1000px;height:180px;cursor:pointer;border:0;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel)}
.flip .f{font-family:var(--serif);font-weight:700;font-size:21px}
.flip .b{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent);font-family:var(--serif);font-size:15.5px;line-height:1.45;overflow:auto;align-items:safe center}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:28px}
/* mobile */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  #menuBtn{display:grid}
  .side{position:fixed;top:56px;left:0;bottom:0;width:min(320px,86vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .app.sbopen .side{transform:none}
  .stage{padding:20px 16px 110px}
  .card{padding:28px 20px;border-radius:12px}
  .prose{font-size:18px}
  .cover{grid-template-columns:1fr;gap:20px}
  .cover figure{max-width:220px}
  .cover .work{font-size:34px}
  .doc-h{font-size:24px}
  .gl-list li{grid-template-columns:1fr;gap:4px}
  .q-body{padding:0 16px 16px}
  .top .crumb,.top .sep{display:none}
}
@media print{
  .top,.side,.pager{display:none!important}
  .app{display:block;height:auto}
  .main{overflow:visible}
  .card{box-shadow:none;border:0;padding:0}
}
</style>

<div class="app" id="app">

</div>
<script>
const MODE="slides", KEY="Ревизор_03_Манн_Комедия_характеров_с_гротескным_отсветом_html", D={"heading": "Ю. МАНН. КОМЕДИЯ ХАРАКТЕРОВ С ГРОТЕСКНЫМ «ОТСВЕТОМ»", "kicker": "Прочитайте фрагменты статьи Ю.В. Манна, посвященные комедии Гоголя “Ревизор”", "pages": [{"group": "1", "label": "Теперь мы можем посмотреть на комедию…", "html": "<div class=\"part-no\">1<\/div><p>Теперь мы можем посмотреть на комедию в целом, чтобы определить её жанровую природу.<\/p><p>С одной стороны, событийность «Ревизора» построена на интриге, проистекающей из свободной воли персонажа: такую интригу ведёт Городничий (вместе с чиновниками). Городничему, в свою очередь, кажется, что подобную же интригу ведёт Хлестаков. Но интрига Хлестакова не больше чем миражная интрига, и это обстоятельство оказывается определяющим для всего хода действия. В результате — новое проявление «старого правила»: уже, кажется, достигнул, схватил рукою, «как вдруг... отдаление желанного предмета на огромное расстояние». Причём это происходит не только со Сквозником-Дмухановским, но и со всем городом.<\/p><p>Далее. «Ревизор» как пьеса о «сборном городе» отличается почти полной самостоятельностью сценического действия. Нет почти ни одного события, ни одного поворота в сюжете (ниже мы поясним, что значит оговорка «почти»), повода к которым следовало бы искать вне художественного мира комедии. Всё происходящее в ней строго опосредствовано характерами и положениями действующих лиц.<\/p><p>Покажем это на следующем примере. Как известно, теми, кто дал непосредственный толчок действию комедии, были Бобчинский и Добчинский. С известием, которое они, запыхавшись, принесли чиновникам, идея ревизии перешла из области ожидаемого в область реального.<\/p><p>Но возникает вопрос: так ли уж важно, что тут действуют не один, а два персонажа?<\/p><p>Бобчинский и Добчинский... Мы привыкли произносить эти имена рядом, как символ похожести,— и не без оснований. Бездеятельная, паразитическая жизнь, положение городских сплетников и шутов (которыми все помыкают и которые, однако, всем нужны) уподобили их друг другу, обкатали, как два снежных кома одинаковой величины. Они «оба низенькие, коротенькие»... чрезвычайно похожи друг на друга...» («Характеры и костюмы»). Их художественная функция состояла в том, чтобы быть похожими. Похожими, но не тождественными.<\/p><p>При характеристике Бобчинского и Добчинского проявилась вся тонкость типологического мастерства Гоголя. У каждого из них — свой характер. Начать хотя бы с того, что Бобчинский проворнее Добчинского; последний же несколько серьёзнее и солиднее. Он сплетничает с достоинством, как будто совершает важное дело, или, как говорит Анна Андреевна, «до тех пор, пока не войдёт в комнату, ничего не расскажет». И еще один штрих: исполнив свою миссию, Добчинский просит отпустить его за последними новостями («побегу теперь поскорее посмотреть, как там он обозревает») — и Анна Андреевна, соглашается: «Ступайте, ступайте, я не держу вас». Она отпускает его как на государственную службу или как на подвиг... Вот почему, несмотря на то, что рассказать о прибытии «ревизора» удалось Бобчинскому, Городничий берёт с собой к Хлестакову Добчинского (все-таки приличнее и солиднее!), а первому остаётся лишь бежать «петушком» за дрожками.<\/p>"}, {"group": "1", "label": "Пётр Иванович Бобчинский неотделим от Петра…", "html": "<p>Пётр Иванович Бобчинский неотделим от Петра Ивановича Добчинского. Они совместно делают «наблюдения», совместно переживают радость «открытия». Однако в их характерах заложено тончайшее несходство, которое, в свою очередь, порождает между друзьями соперничество, противоречия, вызывает «самодвижение» внутри этого своеобразного человеческого симбиоза. А если вспомнить ту лихорадочную обстановку, которая предшествовала встрече с Хлестаковым в трактире и которая заставляла обоих друзей спешить, напрягать все силы, чтобы не упустить славу открытия, то становится ясным, что их соперничество сыграло не последнюю роль в роковом самообмане города.<\/p><p>В известном смысле можно даже утверждать, что не возникло бы действие пьесы, если бы не было <em>двух<\/em> сплетников и если бы не тончайшие различия в их характерах.<\/p><p>Примерно то же самое можно сказать и о других событиях пьесы, о других поворотах в сюжете.<\/p><p>Известно, например, что Хлестаков уезжает из города не по своей инициативе, а по совету более хитрого Осипа. Но посмотрите, как «заблаговременно» подготавливает драматург этот совет Осипа. Еще в начале второго действия из монолога Осипа мы узнаём, что он обычно делал в Петербурге в трудных случаях: «Наскучило идти — берёшь извозчика и сидишь себе, как барин, а не хочешь заплатить ему,— изволь: у каждого дома есть сквозные ворота, <em>и ты так шмыгнешь, что тебя никакой дьявол не сыщет».<\/em> Затем, при переезде в дом Городничего, когда ещё ничего не предвещает плохого конца, Осип в разговоре со слугой Мишкой неожиданно спрашивает: «Что, там другой выход есть?» Возникает чуть заметный пунктир к будущему изменению в сюжете. И, наконец, решающая реплика: «Уезжайте отсюда. Ей-Богу, уже пора». В этот момент пунктир превращается в сознании читателя в уверенную, чёткую линию «поведения персонажа».<\/p><p>Продолжая высказанную выше мысль, можно утверждать, что Хлестаков не уехал бы из города и события приняли бы иной оборот, если бы он был один, без Осипа.<\/p><p>Или мотивировка такого важнейшего сюжетного хода, как перлюстрация Шпекиным письма Хлестакова и раскрытие тайны «ревизора». Ещё в первом действии мы узнаём, что Шпекин большой любитель читать чужие письма «не то чтоб из предосторожности, а больше из любопытства». Но тут особый случай («да как же вы осмелились распечатать письмо такой уполномоченной особы?» — кричит Городничий), нужен дополнительный стимул,— и вот он: письмо адресовано в «Почтамтскую улицу», Шпекин же служит по почтовой части и невольно заключает, что ревизор «нашел беспорядки по почтовой части». О том же, что Хлестаков пишет в Почтамтскую, мы также узнаём заранее (в четвёртом действии), причём, в свою очередь, это мотивировано свойствами характера и положением адресата — Тряпичкина, который «любит часто переезжать с квартиры и не доплачивать».<\/p><p>Какой бы поворот в сюжете мы ни взяли, Гоголь подводит к нему исподволь, выводя его из сущности и положения героев.<\/p><p>В комедии классицизма и Просвещения драматург, развивая действие, мог опираться во многом на добродетельных персонажей. Они не только служили целям назидания, но одновременно выполняли «полезную работу»; способствовали раскрытию характеров Гарпагонов, Тартюфов, Арнольфов, провоцировали их высказывания и поступки. Без таких уколов и толчков со стороны персонажи раскрываться ещё не умели.<\/p>"}, {"group": "1", "label": "Художественный мир «Ревизора» однороден. Среди его…", "html": "<p>Художественный мир «Ревизора» однороден. Среди его героев есть притеснители и притесняемые, власть имущие и угнетённые. Но ни в ком не допускает Гоголь и тени идеализации. Высеченная ни за что ни про что унтер-офицерша могла бы стать — под пером автора буржуазной, так называемой «слезливой комедии» — прекрасным поводом для противопоставления мещанских добродетелей и бескорыстия произволу и испорченности дворян. По у Гоголя унтер-офицерша после жалобы на Городничего деловито советует Хлестакову: «А за ошибку-то повели ему заплатить штрафт. Мне от своего счастья неча отказываться...»<\/p><p>Все персонажи «Ревизора» — земные люди, созданы из плоти и крови. Это значит, что им приходится полагаться в развитии действия только «на свои силы» и не ждать толчков извне. От однородности художественного мира «Ревизора» возрастает самостоятельность его сценического действия.<\/p><p>Но, повторяем, главную причину этой самостоятельности следует видеть в общей структуре «сборного города», являющегося своеобразным аналогом большого мира. Гоголь не сказал нам, как реализуется единая мысль в существовании современного человечества. Но на вопрос, сформулированный Гоголем-историком, он ответил как художник.<\/p><p>«Ревизор» показал нам, как во взаимодействии людей, занимающих различное социальное положение и обладающих различными характерами, в цепной реакции их поступков возникает общая человеческая жизнь. Все события мира, говорил Гоголь, связаны между собою, «как кольца в цепи». Так связаны между собою все поступки и все свойства героев «Ревизора». Если нейтрализовать любое, самое незначительное из этих качеств, вырвать из цепи одно «кольцо», то действие приостановится.<\/p><p>Отсюда, между прочим, свойство комедии, на которое обратил внимание Игорь Ильинский. «Великие актеры прошлого, создавая запоминающиеся гоголевские образы, не могли всё же добиться стройного звучания всей комедии»<sup class=\"ref\">[1]<\/sup><em>.<\/em> Успех «Ревизора» может быть гарантирован удачным исполнением не одних главных, но обязательно — всех его ролей. Комедия ставит перед театром максималистскую задачу: всё или ничего.<\/p><p>Повторим во избежание недоразумений: Гоголь не подменял логическое решение художественным. Но общее историко-философское умонастроение писателя <em>подвело<\/em> его к определённым формам изобразительности.<\/p><p>Убеждение Гоголя в цельности человеческой истории художественно реализовалось в принципах комедии характеров. Как в истории всё должно быть объяснено не из привходящих толчков, но из неё самой, так и в структуре «сборного города», в характерах его жителей следует искать всеобъемлющие основания возникшего действия.<\/p><p>Гоголь, говорит Немирович-Данченко, находит сценические толчки «не в событиях, приходящих извне, — приём всех драматургов мира», а в тех «неожиданностях, которые проявляются в самих характерах».<\/p><p>И   всё   же   есть  в   комедии   два  толчка,  приходящих извне!<\/p><p>Один — это письмо Чмыхова, завязавшее «ситуацию ревизора». Другой — появление жандарма, развязавшее эту ситуацию.<\/p>"}, {"group": "2", "label": "Прежде чем остановиться на значении этих…", "html": "<div class=\"part-no\">2<\/div><p>Прежде чем остановиться на значении этих «толчков», как будто бы нарушающих общий строй комедии, обратим внимание и на другие аналогичные «противоречия».<\/p><p>«Ревизора» (как комедию характеров) отличает строгая характерность его юмора. Смеясь над персонажами «Ревизора», мы, говоря словами Гоголя, смеёмся не над их «кривым носом, а над кривою душою». Комическое почти целиком подчинено обрисовке типов, возникает из проявления их психологических и социальных свойств.<\/p><p>Отсюда борьба Гоголя с элементами фарса, внешнего комикования, карикатуры, которыми обычно сопровождалось исполнение «Ревизора».<\/p><p>«Больше всего надо опасаться, чтобы не впасть в карикатуру. Ничего не должно быть преувеличенного или тривиального даже в последних ролях»,— писал Гоголь в «Предуведомлении...».<\/p><p>Драматург был недоволен также шаржем в костюмировке персонажей. О внешнем виде Бобчинского и Добчинского на сцене Александринского театра он писал: «Эти два человечка, в существе своем довольно опрятные, толстенькие, с прилично-приглаженными волосами, очутились в каких-то нескладных, превысоких седых париках, всклокоченные, неопрятные, взъерошенные, с выдернутыми огромными манишками, а на сцене оказались до такой степени кривляками, что просто было невыносимо. Вообще костюмировка большей части пьесы была очень плоха и бессовестно карикатурна» («Отрывок из письма...»).<\/p><p>Сам Гоголь в работе над комедией последовательно освобождал действие от элементов карикатуры, фарса. В первой черновой редакции Анна Андреевна рассказывала о штабс-ротмистре Ставрокопытове, который «хотел даже застрелиться; да, говорят, как-то в рассеянности позабыл зарядить пистолет»; о поручике, которого денщик внёс в комнату Анны Андреевны в «преогромном куле с перепёлками». Все эти комические детали носили явно водевильный характер и не отвечали общему строю «Ревизора».<\/p><p>Как водевильный шалун был побочным отпрыском традиционно-комедийного плута, так и фарсовые элементы водевиля вели (опосредствованно) к древним традициям «грубой комики» (Derb Komisches). Этим термином характеризуется более или менее устойчивый круг примет внешнего комизма: всевозможные потасовки, палочные удары, падения, коверканье слов, заиканье, скороговорка, каламбуры и т. д.<\/p><p>В комедии дель арте элементы грубой комики сосредоточивались даже в особых, композиционно самостоятельных частях действия, так называемых «лацци». Обычно «лацци» находились в конце первого и в конце второго актов и включали в себя не связанные с сюжетом буффонные трюки (вроде «лацци с мухой» — ловли и поедания мухи).<\/p><p>Не следует думать, что приёмы грубой комики не имели никаких содержательных функций. Они создавали определённый тип понимания жизни, форму мироощущения. Так, к фарсовым элементам в любовной комедии Лопе де Вега (во многом близкого традициям комедии дель арте) применимо то, что В. Гриб говорит о функции его сценической интриги; с их помощью драматург конструировал «лёгкий, радостный мир, где почти нет грани между желанием и осуществлением, где достаточно только сильно хотеть, чтобы добиться своего, где всегда торжествует личная энергия любовников...»<sup class=\"ref\">[2]<\/sup>.<\/p><p>Но психологической характеристике персонажей грубая комика помогала мало. Как правило, она была сопряжена даже с известным окостенением образа, с устойчивой системой наиболее общих и стереотипных приёмов характерологии.<\/p>"}, {"group": "2", "label": "Мольер значительно ограничил права грубой комики…", "html": "<p>Мольер значительно ограничил права грубой комики. Его «Тартюф», «Скупой» строятся в основном на комизме характеров. Но всё же в большинстве пьес Мольера, восходящих к традициям народного фарса, испанской и французской барочной комедии, а также к комедии дель арте, роль «грубой комики» ещё очень велика.<\/p><p>Гоголь больше, чем кто бы то ни было из его предшественников и современников, подчинил комическое психологической обрисовке героев. В работе над «Ревизором» драматург отталкивался от традиций грубой комики (подобно тому как он отталкивался от ситуации хитроумных влюбленных и от типа водевильного плута).<\/p><p>Это хорошо почувствовал такой тонкий и начитанный рецензент комедии, как Вяземский. «В “Ревизоре” нет ни одной сцены вроде “Скапиновых Обманов”, “Доктора поневоле”,   “Пурсоньяка”   или  Расиновых   “Les Plaideurs” (“Сутяг”); нет нигде вымышленной карикатуры, переодеваний и пр. и пр. За исключением падения Бобчинского и  двери,  нет  ни одной минуты,  сбивающейся на  фарсу. В “Ревизоре” есть карикатурная природа: это дело другое»<sup class=\"ref\">[3]<\/sup>. В интересах точности заметим все же, что, кроме «падения  Бобчинского»,  в   «Ревизоре»   есть  еще несколько сцен и подробностей, близких традиции «грубой комики». Напомним их.<\/p><p>Отдавая спешные приказания к приёму «ревизора», Городничий путает слова: «Пусть каждый возьмет в руки по улице,— черт возьми, по улице! — по метле...»<\/p><p>Минуту спустя он хочет надеть вместо шляпы бумажный футляр.<\/p><p>В записке, полученной Анной Андреевной от мужа, содержится забавная путаница: «Я ничего не понимаю, к чему же тут солёные огурцы и икра?»<\/p><p>Квартальные, которым Городничий указывает па лежащую на полу бумажку, «бегут и снимают её, толкая друг друга впопыхах».<\/p><p>Поздравляя Анну Андреевну с «обручением» дочери, Бобчинский и Добчинский «подходят в одно время и сталкиваются лбами».<\/p><p>Вот, пожалуй, и все подобные сцены и подробности. Нельзя не видеть, что «количество» «грубой комики» в «Ревизоре» самое минимальное.<\/p><p>Одно из значений «грубой комики» у Гоголя состоит в том, чтобы возвыситься над «противоречием», выставить его «на всенародные очи», обезвредить «порок» смехом. В этом значении фарсовые элементы у Гоголя ближе всего соприкасаются с традициями народного юмора и фарсового гротеска. Однако в «Ревизоре» «грубая комика» приобретает дополнительный отсвет. Он возникает из соотношения «грубой комики» и основного принципа построения пьесы как комедии характеров.<\/p><p>Прежде всего ни одно из названных выше забавных недоразумений не становится в «Ревизоре» источником действия. Из путаницы в записке Городничего, содержащей указания к приёму Хлестакова, могло бы что-то произойти важное для развития ситуации. Так сплошь и рядом было и в традиционной, высокой комедии, и особенно в водевиле, где, как говорит один из персонажей «Театрального разъезда...», действие определялось «всякими смешными сцеплениями»: «Ну, положим, например, я отправился на гулянье на Аптекарский остров, а кучер меня вдруг завез там на Выборгскую или к Смольному монастырю».<\/p><p>В «Ревизоре» же «смешные сцепления» — это скорее сопутствующие тона к основному мотиву. Они характеризуют атмосферу спешки, неразберихи, страха, но не являются источником действия и перемен в сюжете.<\/p>"}, {"group": "2", "label": "Кстати, если подойти к самообману Городничего…", "html": "<p>Кстати, если подойти к самообману Городничего и других с точки зрения комического, то ведь перед нами типичный случай qui pro quo. Но Гоголь освободил традиционный сюжетный «ход» от связанных с ним элементов грубой комики: переодевания, подслушивания разговоров<sup class=\"ref\">[4]<\/sup>, нарочитого и грубого хвастовства и т. д. Автор «Ревизора» мотивировал самообман «испуганного города» психологически и социально, о чём достаточно говорилось выше.<\/p><p>Остановимся теперь на тех способах, с помощью которых Гоголь вводит грубую комику в комедийное действие.<\/p><p>Вот  путаница  в  записке  Городничего:   «...уповая  на милосердие божие,   за   два   солёные   огурца   особенно   и полпорции икры рубль двадцать пять копеек». Как уже отмечалось в литературоведении, это довольно характерный для Гоголя случай снижения высоких «понятий» с помощью  бытовых,  нарочито  прозаических.  Но  следует обратить ещё внимание на то, как незаметно,  «основательно»   подготавливает Гоголь   путаницу   в   записке... Городничий   спешит   и  волнуется: он  должен  написать «одну  строчку  жене»   побыстрее  и  в присутствии  Хлестакова. Чистой бумаги у Хлестакова, естественно, не находится, но зато есть счета. Чего-чего, а неоплаченных счетов у него предостаточно  (перед этим происходит диалог Хлестакова со слугой: «Подай <em>счёт».<\/em>— «Я уж давеча подал вам другой счёт».— «Я уже не помню твоих глупых <em>счётов»).<\/em> Один из них и послужил причиной недоразумения.<\/p><p>Словом, из «наличного материала» почти незаметно Гоголь, говоря словами Гофмана, создаёт «забавную перетасовку деталей, чтобы оцарапать сердце читателя». Недоразумение вскоре рассеивается, действие идёт своим чередом, но чуть заметная «царапина» в сознании читателя остаётся.<\/p><p>Способ включения грубой комики подчинён излюбленной гоголевской формуле: всё идет совершенно нормально, даже обычно, но вдруг — неожиданное отклонение от нормы.<\/p><p>В «Замечаниях для г.г. актеров», в первом издании «Ревизора», Гоголь характеризовал типаж гостей: «Они должны быть высокие и низенькие, толстые и тонкие, нечёсаные и причёсанные. Костюмированы тоже должны быть различно: во фраках, венгерках и сюртуках разного цвета и покроя. В дамских костюмах та же пестрота; одне одеты довольно прилично даже с притязанием на моду, но <em>что-нибудь должны иметь не как следует,<\/em> или чепец набекрень, или ридикюль какой-нибудь странный. Другие в платьях уже совершенно не принадлежащих ни к какой моде. С большими платками и чепчиками в виде сахарной головы и проч.».<\/p><p>Вся разнохарактерная, пёстрая масса гостей выглядит нормально. Но всё же попадается несколько субъектов, имеющих странный вид. Подобное отступление от нормы заметно и в отдельном персонаже: одет он прилично, даже по моде, но что-нибудь в нём «не так». Сравните с этим внешний вид Земляники, который носит почти все время обычный фрак, но в четвёртом действии вдруг является в «узком губернском мундире с короткими рукавами и огромным воротником, почти захватывающим уши».<\/p><p>Но именно по такому принципу — отступления от нормы — вводились Гоголем различные формы нефантастической фантастики, что отмечалось нами в III главе.<\/p>"}, {"group": "2", "label": "Словом, элементы грубой комики, фарсового гротеска…", "html": "<p>Словом, элементы грубой комики, фарсового гротеска вводятся в ткань «Ревизора» незаметно и сдержанно; как правило, комическое вытекает у Гоголя из характеров героев, строго мотивировано их психологическим и социальным обликом. Но вот что-то происходит не так, «как следует»; возникает какой-то диссонанс, чуть заметная перетасовка деталей, которую можно даже не принять во внимание<sup class=\"ref\">[5]<\/sup>.<\/p><p>Нет ли тут аналогии с общим построением пьесы, которая развивается как последовательная комедия характеров, но всё же в какие-то моменты (в начале и в конце действия) получает сильные «толчки извне»?<\/p>"}, {"group": "3", "label": "Обратим внимание ещё на одно чуть…", "html": "<div class=\"part-no\">3<\/div><p>Обратим внимание ещё на одно чуть приметное отклонение от «нормы» в стиле комедии.<\/p><p>Автор «Ревизора» старательно соблюдал и поддерживал принцип «четвёртой стены». Всё, что происходит на сцене, как бы заключает цель в самом себе и не рассчитано на эффект зрительного зала. Персонажи пьесы «не знают» и «не догадываются», что кто-то наблюдает за ними со стороны.<\/p><p>Отсюда — полная серьёзность игры актеров, их «отрешённость» от зрительного зала, всемерное погружение в заботы и дела персонажа.<\/p><p>Нетрудно видеть, что соблюдение принципа  «четвёртой стены» было связано у Гоголя с установкой на глубокое раскрытие типов, на создание комедии характеров. В «Предуведомлении...» Гоголь писал: «Чем меньше будет думать  актёр  о  том,  чтобы  смешить  и  быть  смешным, тем более обнаружится смешное взятой им роли. Смешное обнаружится  само собою  именно  в  той  сурьёзности,  с какою занято своим делом каждое из лиц, выводимых в комедии.   Все   они   заняты   хлопотливо, суетливо,   даже жарко  своим  делом,  как  бы важнейшею  задачею  своей жизни. Зрителю только со стороны виден пустяк их заботы. Но сами они совсем не шутят и уж никак не думают о том, что над ними кто-нибудь смеётся». Наивность, или   (как тогда говорили)   «простодушие» смешного, составляет один из важнейших нервов гоголевской  поэтики. Кстати,   будучи   замечательным  актёром, Гоголь своим чтением «Ревизора» дал прекрасное пояснение к тому, что такое простодушие смешного. И. Тургенев пишет, что чтение Гоголем «Ревизора» поразило его «какой-то   важной   и  в   то   же   время  наивной   искренностью, которой словно и дела нет, есть ли тут слушатели и что они думают. Казалось, Гоголь только и заботился о том, как бы вникнуть в предмет для него самого новый и как бы вернее передать собственное впечатление. Эффект выходил необычайный — особенно в комических, юмористических местах...  а виновник всей  этой  потехи продолжал,   не   смущаясь общей  веселостью   и  как  бы внутренне дивясь ей, всё более и более погружаться в самое дело — и лишь изредка, на губах и около глаз, чуть заметно трепетала лукавая усмешка мастера»<sup class=\"ref\">[6]<\/sup>.<\/p><p>Обычно в современной Гоголю сценической практике актёр выделял наиболее выигрышные места роли и подавал их с особым нажимом. Так произносилась реплика Городничего: «...Оно, конечно, Александр Македонский герой, но зачем же стулья ломать?», замечание Бобчинского Добчинскому: «...У вас, я знаю, один зуб во рту со свистом» и т. д. Гоголь, напротив, читал эти фразы без всякой аффектации, с той же наивной искренностью.<\/p><p>«С каким недоумением, с каким изумлением,— продолжает Тургенев,— Гоголь произнёс знаменитую фразу Городничего о двух крысах... «Пришли, понюхали и пошли прочь!» — Он даже медленно оглянул нас, как бы спрашивая объяснения такого удивительного происшествия».<\/p><p>Но простодушие комизма, полное погружение актера (и автора) в «самое дело» — только одна сторона принципа «четвёртой стены». Другую сторону составляет отсутствие в тексте внешних «отсылок» к зрительному залу.<\/p>"}, {"group": "3", "label": "Г. Гуковский, говоря, что автор «Ревизора»…", "html": "<p>Г. Гуковский, говоря, что автор «Ревизора» протягивает «нити от городка на сцене к городу зрительного зала», указывает на некоторые «реалии» в комедии: упоминание Хлестаковым Брамбеуса, Пушкина; его реплика «А один раз меня приняли даже за <em>главнокомандующего»<\/em> и т. д. «Главнокомандующий — это лицо определённое. И в этом месте он, главнокомандующий, если он был в театре, должен был почувствовать себя не совсем ловко, и весь театр, конечно, не мог не поглядеть на главнокомандующего, на которого так похож Хлестаков, или, что то же, который так похож на Хлестакова»<sup class=\"ref\">[7]<\/sup>. Гоголь, хотя и в более умеренной форме, продолжает «от Грибоедова унаследованную манеру вводить в текст комедии слова о тех и о том, что находится в зрительном зале и окружающей его жизни столицы...».<\/p><p>Однако думается, что Гоголь и Грибоедов представляют здесь если не противоположные, то существенно различающиеся стилистические манеры. Выходы за пределы сценического мира достигаются не тем, что комедия использует определённое количество реалий (без этого трудно   себе представить   драматургическое   произведение), а тем, <em>как<\/em> она это делает. В «Горе от ума» пассажи о «ночном   разбойнике, дуэлисте»,   о   Татьяне   Юрьевне, о «Несторе негодяев знатных» и т. д. несколько теряют в своей изобразительной силе без знания реальных обстоятельств и лиц (соответственно: Ф.И. Толстого-Американца, П. Ю. Кологривовой, Л. Д. Измайлова). Художественный  образ   здесь  в большой  мере   ориентирован  на внесценические  обстоятельства  и лица,  усиливается  от взаимодействия с ними. Такой способ обрисовки издавна известен в драматургии: многие страницы комедий Аристофана, богатые злободневными намеками,  шутками, а также  элементами  пародии и  травести,  непонятны  без схолий — древних пояснений к тексту.<\/p><p>В современной Гоголю драматургии «отсылками» к зрительному залу щедро пользовался водевиль с его злободневными куплетами, остротами, пародиями, намёками на реальные факты и лица.<\/p><p>Но Гоголь-то как раз стремился сделать действие комедии максимально самостоятельным; внесценические ассоциации уже не играли в ней такой злободневной роли, как прежде. Упоминание главнокомандующего было ему важно не столько как намёк на конкретное лицо, сколько как штрих к характеристике Хлестакова, добирающегося в «сцене вранья» до самых больших иерархических высот (и в связи с этим, конечно, как штрих к художественному миру комедии в целом).<\/p><p>Реплика Хлестакова: «Всё это, что было под именем барона Брамбеуса, Фрегат Надежды и Московский Телеграф... всё это я написал» — также превышает традиционную комическую «отсылку» к реальным явлениям. Сегодняшний зритель уже смутно воспринимает конкретный смысл этих упоминаний, однако он хорошо улавливает создаваемое ими впечатление разнородности и случайности,— то, ради чего прежде всего и введены эти реалии в речь Хлестакова.<\/p><p>С другой стороны, в работе над комедией Гоголь всемерно сужал круг реалий. Он устранял те, которые имели самодовлеющее значение, нарушали цельность поэтического строя комедии.<\/p><p>Гоголь, конечно, заботился о максимальном приближении своего «сборного города» к реальному миру, но он это делал другим путём: с помощью «округления» комедийного действия, последовательного отделения его от   зрительного зала «четвёртой стеной».<\/p><p>И всё же есть в комедии одно-два места, нарушающие принцип «четвёртой стены»!<\/p>"}, {"group": "3", "label": "После разоблачения Хлестакова, во время чтения…", "html": "<p>После разоблачения Хлестакова, во время чтения его письма, герои комедии произносят свои реплики, адресуясь в зрительный зал: «Ну, скверный мальчишка, которого надо высечь...», «И не остроумно! свинья в ермолке! где ж свинья бывает в ермолке» и т. д.<\/p><p>А через несколько мгновений, как в парабасе древней аттической комедии, звучит знаменитое «Чему смеётесь? над собою смеётесь!.. Эх вы!..»<\/p><p>В тексте комедии эта реплика не сопровождается ремаркой «к зрителям», следовательно, адресуется Городничим обступившим его гостям. Но в «Развязке Ревизора» реплика послужила темой специального обсуждения. Семён  Семёнович   («человек...  немалого света»)   воспринимает фразу Городничего именно как реплику в зал: «...Какое неуважение, какая даже дерзость... как сметь сказать в глаза всем: «Что смеётесь? над собою смеётесь!» Петр Петрович   («человек  большого   света»)   подтверждает ту же мысль: «...Вероятно, не одному из сидевших в театре показалось, что автор как бы к нему самому обращает эти слова «над собою смеётесь!». В ответ на эти замечания  Первый  комический  актер   (то   есть  М. Щепкин), ссылаясь на сообщенное ему мнение самого автора,   объясняет: «...Вышло это само собой. В монологе, обращённом к самому себе, актёр обыкновенно обращается к стороне  зрителей.  Хотя  Городничий  был в беспамятстве  и почти в  бреду,  но он не  мог не  заметить усмешки на лицах   гостей,   которую   возбудил   он   смешными   своими угрозами всех  обманувшему Хлестакову...  Но позвольте мне с моей стороны сделать запрос:  ну что если бы у сочинителя  точно  была  цель  показать зрителю, что он над собой смеется?»<\/p><p>Таким образом, реплика адресуется персонажам, но в то же время произносится в сторону зрителей; при этом Первый комический актёр не видит ничего зазорного в том, что зрителями она может быть принята на свой счёт. В заключительном монологе Первого комического актера об этом сказано со всей определённостью: «Не возмутимся духом, если бы какой-нибудь рассердившийся городничий, или, справедливей, сам нечистый дух шепнул его устами: «Что смеётесь? над собой смеётесь!» Гордо ему скажем: «Да, над собой смеёмся...» Очевидно, в подаче реплики Гоголем допускалась нарочитая двойственность; фиксировалась её сценическая мотивированность и адресованность к персонажам, но в то же время предполагалась и её обращённость к зрителям<sup class=\"ref\">[8]<\/sup>.<\/p><p>Что это: непоследовательность драматурга? Или же чуть заметная «лукавая усмешка мастера», на мгновение нарушающая иллюзию беспристрастия и невмешательства в комедийное действие?<\/p>"}, {"group": "4", "label": "И внешние толчки в развитии интриги…", "html": "<div class=\"part-no\">4<\/div><p>И внешние толчки в развитии интриги, и элементы «фарсового гротеска», и нарушение принципа «четвёртой стены» — всё это явления одного порядка. Они ведут нас в глубь жанра комедии.<\/p><p>«Ревизор» строится как комедия характеров, исключающая вмешательство извне. Его юмор психологичен и обусловлен несходством и многообразием человеческих типов. Его действие объективировано и не допускает выхода за рампу.<\/p><p>Это — норма «Ревизора», формула его внутренней opraнизации. Однако Гоголь нарушает эту норму. Мы снова попадаем в поле действия главного противоречия художественной мысли Гоголя, отражающего по-своему противоречия «меркантильного века».<\/p><p>Гоголь верил в то, что существование человечества не бессмысленно, не алогично, что через всю историю проходит одна «общая мысль». Он верил также в то, что эту мысль можно схватить, воспроизвести — в труде ли историка или в «полной поэме» художника.<\/p><p>Но раздробленность «нашего юного и дряхлого века», усиленная и обострённая русскими полицейски-бюрократическими порядками, на каждом шагу грозила опрокинуть эту веру. Меркантильный век рождал ощущение алогизма, фрагментарности.<\/p><p>Гоголь мог бы поддаться этому ощущению, как поддались ему на рубеже XVIII—XIX веков романтики. Но он стремился стать выше «хаотической точки зрения», В «Авторской исповеди» Гоголь пометил «Ревизором» начало своего творческого пути как писателя-гражданина. «Ревизор» был программным произведением Гоголя, утверждавшим и цельность современной человеческой жизни, и возможность её цельного (художественно-образного) познания. Затем эти принципы Гоголь намеревался закрепить «Мёртвыми душами»...<\/p><p>Но Гоголь был беспощадно правдив, и идею цельности он утверждал, не скрадывая противоречия времени, а обнажая их. Это значит, что нечто от «страшного раздробления жизни» входило важнейшей краской в его художественный мир.<\/p><p>Оно не только продиктовало Гоголю «ситуацию ревизора» как современную (и извращенную) форму человеческой общности.<\/p><p>Оно не только привело к открытию центрального образа этой ситуации, Хлестакова, как «олицетворённого обмана» и к созданию особой миражной интриги.<\/p><p>Но оно также наложило отпечаток и на жанр «Ревизора», обусловив некоторые отступления от принятой «нормы».<\/p><p>В силу всего сказанного мы и определяем «Ревизор» как комедию характеров с гротескным отсветом.<\/p><p>В «Портрете» (редакция «Арабесок») художник-монах говорил, что если «в мире нашем... совершается всё в естественном порядке», то антихрист должен родиться и проникнуть в мир «сверхъестественным образом».<\/p><p>Так, в совершенно «естественном порядке», протекает действие комедии. Один поступок влечёт за собой другой. Причина приводит к следствию. Все звенья строго сочленены, как кольца в цепи. Комедийная жизнь функционирует, как хорошо налаженный механизм.<\/p><p>Но что-то почти неприметно «царапает» сознание читателя: то гротескная, алогичная ассоциация, вдруг возникающая и бесследно исчезающая; то мгновенное нарушение принципа «четвёртой стены». И, наконец, эти два «толчка извне», в начале и в конце действия, словно приоткрывающие какую-то глухую подземную работу...<\/p><p>Хлестаков — это не Антихрист из «Портрета». Но Городничий говорит о нём: «Чудно всё завелось теперь на свете: хоть бы народ-то уж был видный, а то худенькой, тоненькой — как его узнаешь, кто он?»<\/p>"}, {"group": "4", "label": "Городничий хочет сказать, что ревизор теперь…", "html": "<p>Городничий хочет сказать, что ревизор теперь пошёл какой-то странный и что виновато во всём нынешнее странное время. Надо, однако, добавить, что «странен» не только «ревизор», но в известной мере и Городничий и чиновники. Чтобы так обмануться в Хлестакове, им надо было вдоволь хлебнуть воздуху нового времени.<\/p><p>Герои «сборного города» живут как у кратера вулкана, с минуты на минуту ожидая удара и катастрофы. В этом художественная функция внешних «толчков», выпадающих из строя комедии характеров. И если первый толчок (письмо Чмыхова) привёл «общую группу» в движение, побудил к суетливой, лихорадочной деятельности, то второй — известие о настоящем ревизоре — заставил её окаменеть...<\/p><p>В истории новой европейской комедии положение «Ревизора» особое и, может быть, исключительное. Он близок к важнейшим направлениям реалистической художественной мысли XIX века, но выражает их по-гоголевски оригинально.<\/p><p>«Ревизор» разделяет стремление новейшей европейской драмы к крайнему обобщению. Правда, широта «Ревизора» может показаться довольно скромной по сравнению с эпичностью «Бориса Годунова» (1825), «Смерти Дантона» (1835) Бюхнера или «Принца Гомбургского» (1810) Клейста. В этих пьесах на театральные подмостки выходят десятки и сотни героев; оживают целые исторические эпохи: войны, междоусобия, революции. Зритель еле успевает следить за бурными событиями царствования Годунова и польской интервенции, французской революции накануне падения якобинской диктатуры или борьбы немцев со шведами в год битвы при Фербеллине. Однако у «Ревизора» есть своё преимущество в обобщении.<\/p><p>В «Борисе Годунове», «Смерти Дантона», «Принце Гомбургском» и других эпически широких драмах нового времени действие разомкнуто. Люди приходят на сцену и уходят; ветер истории свободно продувает сценическую площадку. Особенность начала и конца пьесы символизирует эту открытость: действие завязывается и обрывается на полуслове. Вспомним пушкинское «Народ безмолвствует», таящее в себе возможности новых перипетий и, следовательно, новых драм. Диапазон названных пьес очень широк, но за его пределами остаются пространства ещё более обширные.<\/p><p>В «Ревизоре» же художественный мир замкнут. Графически он напоминает более окружность, чем полосу, имеющую за пределами сцены начало и продолжение. Завязка, вызвавшая «ситуацию ревизора», начинает собственно историческую жизнь Города; по-видимому, до этого момента ничего достойного внимания историка-художника (то есть ничего находящегося на уровне цельной, общенародной заботы) в городе не происходило. Финал «Ревизора» не таит в себе зерна новых коллизий, он как бы подводит черту «миражной жизни». Все герои комедии (кроме Хлестакова и Осипа) принадлежат этому миру и от начала до конца участвуют в её действии. Всё происходящее в ней выведено из «наличного материала», заложено уже в природе сценического мира.<\/p><p>Благодаря этому реальный масштаб «Ревизора» значительно больше номинального. Перед нами действительно, как в старой аттической комедии, «весь» мир.<\/p><p>Однако к крайнему обобщению Гоголь идет через конкретный и целенаправленный анализ характеров и общественного быта. Тут первостепенное значение для Гоголя имело взаимодействие с традицией Мольера.<\/p>"}, {"group": "4", "label": "Как писал Гюстав Лансон, «комизм и…", "html": "<p>Как писал Гюстав Лансон, «комизм и правда извлекаются Мольером из одного и того же источника» — «из наблюдений над человеческими типами». Шутка Мольера — «интенсивное проявление характера, обнаруживающегося сразу во всей своей глубине»<sup class=\"ref\">[9]<\/sup>. Гоголь вполне оценил это достижение Мольера («...ты, который так обширно и в такой полноте развивал свои характеры...»). Однако он считал, что типологическое мастерство должно быть поднято ещё выше — на уровень реалистического сознания XIX века; что характеры должны быть разработаны «не в общих, вытверженных чертах, но в их национально вылившейся форме» («Петербургские записки 1836 года»); что, наконец, современность характеров должна быть дополнена современностью ситуации («ситуация ревизора» вместо проделок хитроумных влюблённых) .<\/p><p>Гоголь точно предугадал судьбы русского и европейского театра. Всё развитие реалистической драмы XIX— XX веков пошло под знаком художественного исследования характеров. В театре Тургенева, Ибсена, Чехова искусство психологического анализа бесконечно утончилось и углубилось; были выявлены мельчайшие движения и полутона духовной жизни человека; появились новые понятия: психологический подтекст, подводное течение и т. д. Драматургия Горького и Брехта пристально исследовала социальные основы характера, усилила внимание к сфере интеллектуальной жизни человека. По всем этим «статьям» «Ревизор» не может соперничать с последующими великими произведениями. Но, пожалуй, ни к одной другой драме не подходит так название «комедии характеров», как к «Ревизору».<\/p><p>«Ревизор» не только выявляет характеры; он ими сцементирован. От еле заметного психологического свойства любого персонажа зависит весь ход пьесы. В известном смысле можно даже утверждать, что в «Ревизоре» ничего нет, кроме характеров. Там, где начинается их самообнаружепие, возникает действие пьесы. И в тот момент, когда они исчерпывают себя, действие кончается. Комедия характеров явилась в конце концов той «формулой жанра», в которую вылилось гоголевское обобщение.<\/p><p>Одного этого было бы достаточно, чтобы «Ревизор» занял своё, почётное место в истории новейшей драматургии. Но Гоголь усложнил жанр «Ревизора»: по художественной ткани комедии характеров осторожно, не разрушая её структуру, драматург пропустил одну-две еле заметные гротескные нити.<\/p><p>Их художественные традиции сложны и глубоки: они ведут через поэтику романтиков к фарсовым и гротескным элементам литературы классицизма и Возрождения, к древним источникам народного театра (украинский «вертеп», итальянская комедия дель арте, античная сицилийская комедия). В общем построении драмы Гоголь отталкивался и преодолевал эти традиции (поскольку они мешали психологической дифференциации, углублению характеров). Но кое-что от них всё же вошло в поэтику «Ревизора».<\/p><p>Жизненные же корни «гротескного» в «Ревизоре» уходят в художественную мысль Гоголя и в отражённую ею действительность. Мы словно видим, как «страшное раздробление» жизни (и западной и русской) бросает отсвет на художественную фактуру «Ревизора». Гротескные элементы ещё более усиливают обобщённость комедии, заложенную уже в её основе — структуре н образе жизни «сборного города».<\/p>"}]};
const $=s=>document.querySelector(s);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

 l:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>',

 chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',

 $('#themeBtn').onclick=()=>{const dark=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#151618';

/* ---------- slides ---------- */
if(MODE==='slides'){
  const P=D.pages; let cur=Math.min(store.get('pos',0),P.length-1); let seen=new Set(store.get('seen',[]));
  const side=$('#side'); let h=''; let lastG=null;
  const gcount={}; P.forEach(p=>{if(p.group)gcount[p.group]=(gcount[p.group]||0)+1});
  P.forEach((p,i)=>{
    const multi=p.group&&gcount[p.group]>1;
    if(p.group!==lastG&&p.group&&(multi||/^\d$/.test(p.group))){
      if(!(multi&&p.label===p.group)) h+=`<div class="grp${/^\d$/.test(p.group)?' num':''}">${esc(p.group)}</div>`;
    }
    lastG=p.group;
    const sub=multi&&p.label!==p.group;
    h+=`<a data-i="${i}" class="${sub?'sub':''}"><span class="n">${i+1}</span><span>${esc(p.label)}</span></a>`;
  });
  side.innerHTML=h;
  side.onclick=e=>{const a=e.target.closest('a');if(a){go(+a.dataset.i);$('#app').classList.remove('sbopen')}};
  function go(i){
    if(i<0||i>=P.length)return; cur=i; seen.add(i); store.set('pos',i); store.set('seen',[...seen]);
    const head=(i===0&&D.heading)?`${D.kicker?`<div class="kicker">${esc(D.kicker)}</div>`:''}<h1 class="doc-h">${esc(D.heading)}</h1>`:'';
    $('#stage').innerHTML=`<article class="card slide">${head}<div class="prose">${P[i].html}</div></article>`;
    $('#main').insertAdjacentHTML('beforeend','');
    pager.querySelector('.cnt').textContent=`${i+1} / ${P.length}`;
    pager.querySelector('.prev').disabled=i===0; pager.querySelector('.next').disabled=i===P.length-1;
    side.querySelectorAll('a').forEach(a=>{const k=+a.dataset.i;a.classList.toggle('on',k===i);a.classList.toggle('seen',seen.has(k)&&k!==i)});
    const on=side.querySelector('a.on'); if(on)on.scrollIntoView({block:'nearest'});
    $('#main').scrollTo({top:0,behavior:'instant'}); prog((i+1)/P.length);
  }
  const pager=document.createElement('div'); pager.className='pager';
  pager.innerHTML=`<div class="bar"><button class="prev" aria-label="←">${ICON.l}</button><span class="cnt"></span><button class="next" aria-label="→">${ICON.r}</button></div>`;
  $('#main').appendChild(pager);
  pager.querySelector('.prev').onclick=()=>go(cur-1); pager.querySelector('.next').onclick=()=>go(cur+1);
  document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  go(cur);
}

   <p class="lead">${D.intro}</p>
   <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><div class="val" id="val"></div></div>
   <ul class="terms">${D.terms.map((t,i)=>`<li><button class="term" data-i="${i}"><span class="box">${ICON.chk}</span><span>${esc(t)}</span></button></li>`).join('')}</ul>
   <div class="callout">${D.outro}</div></article>`;
  function upd(){document.querySelectorAll('.term').forEach(b=>b.classList.toggle('on',on.has(+b.dataset.i)));
    const p=on.size/D.terms.length;$('#fill').style.width=p*100+'%';$('#val').textContent=`${on.size} / ${D.terms.length}`;prog(p);store.set('on',[...on])}
  document.querySelectorAll('.term').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;on.has(i)?on.delete(i):on.add(i);upd()});
  upd();
}

   ${D.questions.map((q,i)=>`<div class="q" data-i="${i}"><button class="q-head">${D.numbered?`<span class="no">${i+1}</span>`:''}<span class="tx">${q}</span><span class="dot"></span><span class="chev">${ICON.chev}</span></button>
     <div class="q-body"><textarea spellcheck="true" aria-label="${i+1}"></textarea></div></div>`).join('')}</article>`;
  function upd(){let n=0;document.querySelectorAll('.q').forEach(q=>{const has=!!(drafts[q.dataset.i]||'').trim();q.classList.toggle('has',has);if(has)n++});prog(n/D.questions.length)}
  document.querySelectorAll('.q').forEach(q=>{const i=q.dataset.i,ta=q.querySelector('textarea');ta.value=drafts[i]||'';
    q.querySelector('.q-head').onclick=()=>{q.classList.toggle('open');if(q.classList.contains('open'))ta.focus()};
    ta.oninput=()=>{drafts[i]=ta.value;store.set('drafts',drafts);upd()}});
  upd();
}

  let view=store.get('view','list'), letter=null, q='', flipped=new Set();
  const letters=[...new Set(D.entries.map(e=>e[0][0].toLowerCase()))];
  $('#stage').innerHTML=`<article class="card slide"><div class="kicker">${esc(D.kicker)}</div><h1 class="doc-h">${esc(D.heading)}</h1>
   <div class="gl-tools"><label class="search">${ICON.search}<input id="q" type="search" autocomplete="off"></label>
   <div class="seg"><button data-v="list" aria-label="≡">${ICON.list}</button><button data-v="cards" aria-label="▦">${ICON.grid}</button></div></div>
   <div class="abc">${letters.map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div>
   <div id="out"></div></article>`;
  function draw(){
    document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
    document.querySelectorAll('.abc button').forEach(b=>b.classList.toggle('on',b.dataset.l===letter));
    const ql=q.trim().toLowerCase();
    const list=D.entries.map((e,i)=>[e,i]).filter(([e])=>(!letter||e[0][0].toLowerCase()===letter)&&(!ql||(e[0]+' '+e[1]).toLowerCase().includes(ql)));
    const out=$('#out');
    if(!list.length){out.innerHTML='<div class="empty">—</div>';return}
    if(view==='list') out.innerHTML=`<ul class="gl-list">${list.map(([e])=>`<li><div class="t">${esc(e[0])}</div><div class="d">${esc(e[1])}</div></li>`).join('')}</ul>`;
    else{out.innerHTML=`<div class="gl-cards">${list.map(([e,i])=>`<button class="flip${flipped.has(i)?' on':''}" data-i="${i}"><div class="in"><div class="f">${esc(e[0])}</div><div class="b">${esc(e[1])}</div></div></button>`).join('')}</div>`;
      out.querySelectorAll('.flip').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;flipped.has(i)?flipped.delete(i):flipped.add(i);c.classList.toggle('on');prog(flipped.size/D.entries.length)})}
  }
  $('#q').oninput=e=>{q=e.target.value;draw()};
  document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);draw()});
  document.querySelectorAll('.abc button').forEach(b=>b.onclick=()=>{letter=letter===b.dataset.l?null:b.dataset.l;draw()});
  draw(); prog(0);
}
</script>
</body>
</html>
